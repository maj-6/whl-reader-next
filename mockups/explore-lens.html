<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EB01 Explore · Lens — WHL Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<style>
  html, body { height: 100%; }
  body { overflow: hidden; position: relative; }

  /* chrome topbar → floating translucent bar over the stage */
  .topbar {
    position: absolute; top: 12px; left: 12px; right: 12px; z-index: 60;
    border: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
    border-radius: var(--radius-lg);
    background: color-mix(in srgb, var(--bg-raise) 82%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
  }

  .stage { position: absolute; inset: 0; }
  #osd { position: absolute; inset: 0; }
  #osd .openseadragon-canvas:focus { outline: none; }

  /* column label, bottom right, quiet */
  .colchip { position: absolute; right: 14px; bottom: 12px; z-index: 55;
    font: 12px var(--font-chrome); color: var(--ink-2);
    background: color-mix(in srgb, var(--bg-raise) 85%, transparent);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
    border-radius: 99px; padding: 4px 12px; pointer-events: none; }

  /* case chip shared by loupe and cards */
  .lens-chip { display: inline-block; font: 600 10.5px/1 var(--font-chrome);
    letter-spacing: .04em; color: var(--ink-2); background: var(--tint-region);
    border: 1px solid var(--line-2); border-radius: 99px; padding: 3px 8px;
    white-space: nowrap; }

  /* ---- the loupe ---- */
  .loupe { position: fixed; z-index: 80; max-width: 300px; pointer-events: none;
    background: color-mix(in srgb, var(--bg-raise) 94%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-lg); padding: 8px 11px 9px; }
  .loupe .lens-chip { margin-bottom: 5px; }
  .loupe .lp-xl { font: 13px/1.5 var(--font-read); color: var(--ink);
    display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .loupe.empty { padding: 6px 14px; }
  .loupe.empty .lp-xl { color: var(--ink-3); }

  /* ---- frozen cards (anchored to the roll via overlay wrap) ---- */
  .lens-card { position: absolute; left: 0; top: 0; width: 270px;
    transform: translate(-8px, -8px); pointer-events: auto;
    background: color-mix(in srgb, var(--bg-raise) 94%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-lg); }
  .lc-head { display: flex; align-items: center; gap: 6px; padding: 6px 6px 0 10px; }
  .lc-sp { flex: 1; }
  .lc-btn { border: 0; background: none; padding: 2px 5px; cursor: pointer;
    color: var(--ink-3); font: 13px/1 var(--font-chrome); border-radius: var(--radius); }
  .lc-btn:hover { color: var(--ink); background: var(--tint-region); }
  .lc-exp { transition: transform .15s ease; }
  .lc-exp.open { transform: rotate(180deg); }
  .lc-body { max-height: 170px; overflow-y: auto; scrollbar-width: thin;
    padding: 6px 11px 9px; }
  .lc-xl { font: 12.5px/1.5 var(--font-read); color: var(--ink); }
  .lc-tx { font: italic 12px/1.5 var(--font-read); color: var(--ink-2);
    border-top: 1px solid var(--line); margin-top: 7px; padding-top: 6px; }
</style>
</head>
<body>
<script>const _s=localStorage.getItem('whlnext-scheme')||'archive',_m=localStorage.getItem('whlnext-mode')||'light';document.documentElement.dataset.scheme=_s;document.documentElement.dataset.mode=_m;</script>

<div class="stage">
  <div id="osd"></div>
  <div class="colchip" id="colChip"></div>
</div>

<div class="loupe" id="loupe" hidden>
  <span class="lens-chip" id="loupeChip" hidden></span>
  <div class="lp-xl" id="loupeXl">&mdash;</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/openseadragon@5.0/build/openseadragon/openseadragon.min.js"></script>
<script type="module">
import { createBus } from './lib/whl-bus.js';
import { mountChrome } from './lib/whl-chrome.js';
import { createRoll } from './explore-common.js';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const bus = createBus();
mountChrome({
  title: 'Papyrus Ebers', back: 'explore-concepts.html',
  book: { label: 'EB01', title: 'Papyrus Ebers', thumb: 'assets/thumbs/EB01.jpg' },
  adv: false, mockSwitch: 'mode-only', bus,
  note: 'Loupe: press-and-hold or hold Space to peek; a quick click pins a card (max 3); Esc clears.',
});

const stage = $('#osd');
/* createRoll merges viewerOpts.profile over its scroll-h RTL defaults; the full
   profile is restated here only for explicitness. */
const { viewer, store } = createRoll({ el: stage, bus,
  viewerOpts: { profile: { layout: 'scroll-h', direction: 'rtl', gap: 0, zoomOnSelect: false } } });
const regionOf = (page, r) => { try { return store.get(page)?.source?.regions?.[r] || null; } catch { return null; } };

/* clicks on card controls: in OSD mode the canvas retargets real clicks, so each
   control gets its own MouseTracker (mirrors whl-viewer's clickable path). */
const OSD = window.OpenSeadragon;
function onTap(el, fn) {
  if (OSD && OSD.MouseTracker) new OSD.MouseTracker({ element: el,
    clickHandler: ev => { if (ev.quick === false) return; fn(); } });
  else el.addEventListener('click', e => { e.stopPropagation(); fn(); });
}

/* ---------- loupe: information only while summoned ---------- */
const loupe = $('#loupe'), loupeChip = $('#loupeChip'), loupeXl = $('#loupeXl');
let ptrX = innerWidth / 2, ptrY = innerHeight / 2;
let hov = null;                              // {page, region} under the pointer
let holdTimer = 0, downX = 0, downY = 0;
let holdLoupe = false, spaceLoupe = false, suppressSelect = false;

function renderLoupe() {
  const on = holdLoupe || spaceLoupe;
  loupe.hidden = !on;
  if (!on) return;
  const reg = hov && regionOf(hov.page, hov.region);
  if (reg && (reg.translation || reg.text)) {
    loupeChip.hidden = !reg.case_label;
    loupeChip.textContent = reg.case_label || '';
    loupeXl.textContent = reg.translation || reg.text;
    loupe.classList.remove('empty');
  } else {
    loupeChip.hidden = true;
    loupeXl.textContent = '—';
    loupe.classList.add('empty');
  }
  const w = loupe.offsetWidth, h = loupe.offsetHeight;
  let x = ptrX + 16, y = ptrY + 20;
  if (x + w > innerWidth - 8) x = Math.max(8, ptrX - w - 16);
  if (y + h > innerHeight - 8) y = Math.max(8, ptrY - h - 20);
  loupe.style.left = x + 'px'; loupe.style.top = y + 'px';
}

/* press-and-hold ≥150ms without drag summons the loupe; >6px of motion is an OSD drag */
stage.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('.lens-card')) return;
  downX = e.clientX; downY = e.clientY;
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => { holdTimer = 0; holdLoupe = true; suppressSelect = true; renderLoupe(); }, 150);
}, true);
window.addEventListener('pointermove', e => {
  ptrX = e.clientX; ptrY = e.clientY;
  if (holdTimer && Math.hypot(e.clientX - downX, e.clientY - downY) > 6) { clearTimeout(holdTimer); holdTimer = 0; }
  if (holdLoupe || spaceLoupe) renderLoupe();
}, true);
function endHold() {
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = 0; }
  if (holdLoupe) { holdLoupe = false; renderLoupe(); setTimeout(() => { suppressSelect = false; }, 350); }
}
window.addEventListener('pointerup', endHold, true);
window.addEventListener('pointercancel', endHold, true);

bus.on('hover', h => {
  if (!h || h.region == null) return;
  hov = { page: h.page, region: h.region };
  if (typeof h.px === 'number') { ptrX = h.px; ptrY = h.py; }
  if (holdLoupe || spaceLoupe) renderLoupe();
});
bus.on('hover:clear', () => { hov = null; if (holdLoupe || spaceLoupe) renderLoupe(); });

/* ---------- frozen cards: quick click pins, max 3, FIFO ---------- */
const cards = [];   // {id, wrap, el}
function removeCard(id) {
  const i = cards.findIndex(c => c.id === id);
  if (i >= 0) { cards[i].wrap.remove(); cards.splice(i, 1); }
}
function addCard(page, r) {
  const reg = regionOf(page, r);
  if (!reg || !Array.isArray(reg.box)) return;
  const id = page + '/' + r;
  if (cards.some(c => c.id === id)) return;
  const el = document.createElement('div');
  el.className = 'lens-card';
  el.innerHTML =
    `<div class="lc-head">` +
      (reg.case_label ? `<span class="lens-chip">${esc(reg.case_label)}</span>` : '') +
      `<span class="lc-sp"></span>` +
      (reg.text ? `<button type="button" class="lc-btn lc-exp" title="Transliteration">&#8964;</button>` : '') +
      `<button type="button" class="lc-btn lc-x" aria-label="Close">&times;</button>` +
    `</div>` +
    `<div class="lc-body">` +
      `<div class="lc-xl">${esc(reg.translation || '—')}</div>` +
      (reg.text ? `<div class="lc-tx" hidden>${esc(reg.text)}</div>` : '') +
    `</div>`;
  const wrap = viewer.addOverlayEl(page, reg.box, el);
  if (!wrap) return;
  const exp = el.querySelector('.lc-exp'), tx = el.querySelector('.lc-tx');
  if (exp && tx) onTap(exp, () => { tx.hidden = !tx.hidden; exp.classList.toggle('open', !tx.hidden); });
  onTap(el.querySelector('.lc-x'), () => removeCard(id));
  cards.push({ id, wrap, el });
  if (cards.length > 3) removeCard(cards[0].id);
}
bus.on('select', s => {
  if (!s || typeof s.px !== 'number') return;                 // programmatic — ignore
  if (suppressSelect || holdLoupe) { bus.emit('select:clear', {}); return; }  // a hold is not a click
  addCard(s.page, s.region);
});

/* ---------- column label ---------- */
const colChip = $('#colChip');
let curCol = 'col-0045';
const ebNum = s => { const m = /Eb\s*(\d+)/.exec(s || ''); return m ? m[1] : null; };
function updChip() {
  let regs = null;
  try { regs = store.get(curCol)?.source?.regions || null; } catch { }
  let range = '';
  if (regs) {   // first/last regions may be unlabelled continuations — scan
    const ns = regs.map(r => ebNum(r.case_label)).filter(Boolean);
    if (ns.length) range = ' · Eb ' + ns[0] + (ns[ns.length - 1] !== ns[0] ? '–' + ns[ns.length - 1] : '');
  }
  colChip.textContent = 'Column ' + (+curCol.slice(4)) + range;
}
bus.on('view', v => { if (v && v.page) { curCol = v.page; updChip(); } });
bus.on('layer', l => { if (l && l.page === curCol && l.name === 'source' && l.status === 'ready') updChip(); });
updChip();

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if (e.code === 'Space' && !e.target.closest('button, a')) {
    if (!e.repeat && !spaceLoupe) { spaceLoupe = true; renderLoupe(); }
    e.preventDefault();
  }
  else if (e.key === 'ArrowLeft') { viewer.next(); e.preventDefault(); }   // RTL: next is left
  else if (e.key === 'ArrowRight') { viewer.prev(); e.preventDefault(); }
  else if (e.key === 'Escape') {
    holdLoupe = false; spaceLoupe = false; renderLoupe();
    while (cards.length) removeCard(cards[0].id);
    bus.emit('select:clear', {});
  }
});
window.addEventListener('keyup', e => { if (e.code === 'Space' && spaceLoupe) { spaceLoupe = false; renderLoupe(); } });
window.addEventListener('blur', () => { spaceLoupe = false; endHold(); renderLoupe(); });
</script>
</body>
</html>
