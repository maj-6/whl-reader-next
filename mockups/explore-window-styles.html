<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore — Window styles — WHL Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<style>
  html, body { height: 100%; }
  body { overflow: hidden; }

  .stage { position: absolute; inset: 0; background: var(--bg-sunk); }
  #osd { position: absolute; inset: 0; }
  #osd .openseadragon-canvas { outline: none; }

  .topbar {
    position: absolute; top: 12px; left: 12px; right: 12px; z-index: 60;
    border: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
    border-radius: var(--radius-lg);
    background: color-mix(in srgb, var(--bg-raise) 80%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
  }

  /* ---- reading window: shared frame, four styles ---- */
  .rw { position: fixed; z-index: 55; display: flex; flex-direction: column;
    border: 1px solid var(--line); border-radius: var(--radius-lg);
    overflow: hidden; }
  .rw.dragging { pointer-events: none; }        /* roll pans underneath mid-drag */
  .rw[data-style="frosted"] { background: color-mix(in srgb, var(--bg-raise) 80%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--shadow); }
  .rw[data-style="card"], .rw[data-style="tabbed"] { background: var(--bg-raise);
    box-shadow: var(--shadow-lg); }
  .rw[data-style="docked"] { border-radius: 0; border-top: 0; border-right: 0; border-bottom: 0;
    background: color-mix(in srgb, var(--bg-raise) 93%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: var(--shadow-lg); }
  .rw[data-style="docked"] .rw-resize { display: none; }

  .rw-head { flex: none; display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-bottom: 1px solid var(--line);
    cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; }
  .rw.dragging .rw-head { cursor: grabbing; }
  .rw-col { font: 600 12.5px var(--font-chrome); color: var(--ink); white-space: nowrap; }
  .rw-case { flex: 1; min-width: 0; font: 11.5px var(--font-chrome); color: var(--ink-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rw-seg { flex: none; display: inline-flex; border: 1px solid var(--line-2);
    border-radius: var(--radius); overflow: hidden; }
  .rw-seg button { border: 0; background: none; padding: 3px 7px; cursor: pointer;
    font: 10.5px var(--font-chrome); color: var(--ink-2); }
  .rw-seg button.active { background: var(--tint-select); color: var(--ink); font-weight: 600; }
  .rw-pin { flex: none; border: 1px solid var(--line-2); background: none; color: var(--ink-2);
    border-radius: var(--radius); padding: 3px 7px; cursor: pointer;
    font: 10.5px var(--font-chrome); }
  .rw-pin:hover { border-color: var(--accent); color: var(--ink); }
  .rw.pinned { z-index: 52; }
  .rw.pinned .rw-head { cursor: grab; }
  .rw.pinned .sec-h { cursor: default; }

  /* tabs (tabbed style only) */
  .rw-tabs { flex: none; display: none; border-bottom: 1px solid var(--line); }
  .rw[data-style="tabbed"] .rw-tabs:not([hidden]) { display: flex; }
  .rw-tabs button { flex: 1; border: 0; background: none; padding: 6px 4px 5px; cursor: pointer;
    font: 11px var(--font-chrome); color: var(--ink-3);
    border-bottom: 2px solid transparent; }
  .rw-tabs button.active { color: var(--ink); border-bottom-color: var(--accent); }

  .rw-body { flex: 1; min-height: 0; overflow-y: auto; --read-size: 14.5px; }
  .rw-empty { padding: 12px; font: 14px/1.6 var(--font-read); color: var(--ink-3); }

  /* collapsible sections */
  .sec { border-bottom: 1px solid var(--line); }
  .sec:last-child { border-bottom: 0; }
  .sec-h { display: flex; align-items: center; justify-content: space-between; width: 100%;
    border: 0; background: none; padding: 6px 12px 5px; cursor: pointer; text-align: left;
    font: 600 10px var(--font-chrome); letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-3); }
  .sec-h:hover { color: var(--ink); }
  .sec-h::after { content: '\25be'; font-size: 10px; }
  .sec.closed .sec-h::after { content: '\25b8'; }
  .sec.closed .sec-b { display: none; }
  .rw[data-style="tabbed"] .sec-h { display: none; }
  .rw[data-style="tabbed"] .sec { display: none; border-bottom: 0; }
  .rw[data-style="tabbed"] .sec.tab-active { display: block; }
  .rw[data-style="tabbed"] .sec.tab-active .sec-b { display: block; }
  .sec-none { padding: 4px 12px 10px; font: 14px/1.6 var(--font-read); color: var(--ink-3); }

  /* whl-text strips reflow inside the window */
  .sec-b.whl-text[data-layout="strip"] .strip-line { white-space: normal; overflow: visible;
    padding: 2px 12px 10px; }
  .sec-b.whl-text[data-layout="strip"] .strip-body { white-space: normal; display: block; }
  .sec-b.whl-text .rg-case { display: none; }    /* the window header names the case */
  .sec-b.whl-text .whl-skel { height: 40px; margin: 4px 12px 10px; }
  .sec-tx .strip-tx2 { font-style: italic; }
  .sec-tx .sec-b.whl-text[data-layout="strip"] .strip-xl2 { display: none; }  /* tx only here */

  /* hieroglyph lines */
  .hl-wrap { padding: 2px 12px 10px; }
  .hl-line { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
  .hl-ref { flex: none; font: 10px var(--font-chrome); color: var(--ink-3); min-width: 34px; }
  .hl-t { font-family: "Noto Sans Egyptian Hieroglyphs", "Segoe UI Historic", sans-serif;
    font-size: 17px; line-height: 1.55; }

  .rw-foot { flex: none; display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-top: 1px solid var(--line); }
  .stepbtn { flex: none; border: 1px solid var(--line-2); background: none; color: var(--ink-2);
    border-radius: var(--radius); width: 22px; height: 22px; cursor: pointer;
    font: 12px/1 var(--font-chrome); padding: 0; }
  .stepbtn:hover { border-color: var(--accent); color: var(--ink); }
  .stepbtn[disabled] { opacity: .35; cursor: default; }
  .stepbtn[disabled]:hover { border-color: var(--line-2); color: var(--ink-2); }
  .rw-count { font: 11px var(--font-chrome); color: var(--ink-3); min-width: 40px; text-align: center; }

  .rw-resize { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px;
    cursor: nwse-resize; touch-action: none; }
  .rw-resize::after { content: ''; position: absolute; right: 4px; bottom: 4px;
    width: 6px; height: 6px; border-right: 2px solid var(--line-2);
    border-bottom: 2px solid var(--line-2); }

  /* dock preview: inset outline at the destination */
  .dock-preview { position: fixed; right: 0; width: 360px; z-index: 54; pointer-events: none;
    background: var(--tint-region); }
  .dock-preview::after { content: ''; position: absolute; inset: 6px;
    border: 1.5px dashed var(--accent); border-radius: var(--radius); }
</style>
</head>
<body>
<script>const _s=localStorage.getItem('whlnext-scheme')||'archive',_m=localStorage.getItem('whlnext-mode')||'light';document.documentElement.dataset.scheme=_s;document.documentElement.dataset.mode=_m;</script>

<div class="stage"><div id="osd"></div></div>

<aside class="rw" id="rw" data-style="frosted" aria-label="Reading window">
  <div class="rw-head" id="rwHead">
    <span class="rw-col" id="rwCol">Col. —</span>
    <span class="rw-case" id="rwCase"></span>
    <div class="rw-seg" id="rwSeg" role="group" aria-label="Window style">
      <button type="button" data-s="frosted" class="active">Frosted</button>
      <button type="button" data-s="card">Card</button>
      <button type="button" data-s="docked">Docked</button>
      <button type="button" data-s="tabbed">Tabbed</button>
    </div>
    <button type="button" class="rw-pin" id="rwPin">Pin</button>
  </div>
  <div class="rw-tabs" id="rwTabs" role="tablist" hidden>
    <button type="button" data-tab="xl" class="active">translation</button>
    <button type="button" data-tab="tx">transliteration</button>
    <button type="button" data-tab="hi">hieroglyphic</button>
  </div>
  <div class="rw-body" id="rwBody">
    <div id="rwSecs">
      <section class="sec sec-xl tab-active" data-k="xl">
        <button type="button" class="sec-h">translation</button>
        <div class="sec-b" id="secXl"></div>
      </section>
      <section class="sec sec-tx" data-k="tx">
        <button type="button" class="sec-h">transliteration</button>
        <div class="sec-b" id="secTx"></div>
      </section>
      <section class="sec sec-hi closed" data-k="hi">
        <button type="button" class="sec-h" aria-label="hieroglyphic">hieroglyphic</button>
        <div class="sec-b"><div class="hl-wrap" id="secHi"></div></div>
      </section>
    </div>
    <div class="rw-empty" id="rwEmpty" hidden>&mdash;</div>
  </div>
  <div class="rw-foot">
    <button type="button" class="stepbtn" id="rwPrev" title="Previous case">&lsaquo;</button>
    <span class="rw-count" id="rwCount"></span>
    <button type="button" class="stepbtn" id="rwNext" title="Next case">&rsaquo;</button>
  </div>
  <div class="rw-resize" id="rwResize" title="Resize"></div>
</aside>

<div class="dock-preview" id="dockPrev" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/openseadragon@5.0/build/openseadragon/openseadragon.min.js"></script>
<script type="module">
import { createBus } from './lib/whl-bus.js';
import { mountChrome } from './lib/whl-chrome.js';
import { createTextPane } from './lib/whl-text.js';
import { createRoll, DATA_COLS, hieroHTML, romanCol } from './explore-common.js';

const $ = s => document.querySelector(s);
const bus = createBus();
const STYLES = ['frosted', 'card', 'docked', 'tabbed'];
const DOCK_W = 360;

const chrome = mountChrome({
  title: 'Papyrus Ebers', back: 'explore-concepts.html', bus,
  book: { label: 'EB01', title: 'Papyrus Ebers', thumb: 'assets/thumbs/EB01.jpg' },
  adv: false, mockSwitch: 'mode-only',
  note: '1&ndash;4 switch styles; edge-drag docks; Pin compares.',
});

const { viewer, store } = createRoll({
  el: $('#osd'), bus, start: 'col-0045',
  viewerOpts: { profile: { zoomOnSelect: false } },
});

/* ---------- highlight fan-out ---------- */
let panes = [], lastH = null;
bus.on('highlight', h => {
  lastH = h;
  viewer.applyHighlight(h);
  for (const p of panes) p.applyHighlight(h);
});

/* ---------- active window targeting ---------- */
let curCol = null, curRegion = 1, selActive = false;
const regionsOf = col =>
  (store.get(col) && store.get(col).source && store.get(col).source.regions) || [];

function mountPanes(col) {
  for (const p of panes) p.destroy();
  panes = [];
  $('#secXl').innerHTML = ''; $('#secTx').innerHTML = '';
  const noData = !DATA_COLS.includes(col);
  $('#rwEmpty').hidden = !noData;
  $('#rwSecs').hidden = noData;
  $('#rwTabs').hidden = noData;
  if (noData) return;
  panes.push(createTextPane({ el: $('#secXl'), bus, store, book: 'EB01', page: col,
    layout: 'strip' }));
  panes.push(createTextPane({ el: $('#secTx'), bus, store, book: 'EB01', page: col,
    layout: 'strip', stripShow: 'both' }));
  for (const p of panes) { p.setRegion(curRegion); if (lastH) p.applyHighlight(lastH); }
}

function renderState() {
  const noData = curCol && !DATA_COLS.includes(curCol);
  $('#rwCol').textContent = 'Col. ' + (curCol ? romanCol(curCol) : '—');
  const regs = regionsOf(curCol), r = regs[curRegion];
  const label = r ? (r.case_label || (r.type === 'header' ? 'column header' : '')) :
    (noData ? '—' : '…');
  $('#rwCase').textContent = label ? '· ' + label : '';
  $('#rwCount').textContent = regs.length ? (curRegion + 1) + ' / ' + regs.length : '';
  $('#rwPrev').disabled = !regs.length || curRegion <= 0;
  $('#rwNext').disabled = !regs.length || curRegion >= regs.length - 1;
  $('#secHi').innerHTML = (r && Array.isArray(r.hl) && r.hl.length)
    ? hieroHTML(r) : '<div class="sec-none">&mdash;</div>';
}

function retarget(col, region) {
  const colChanged = col !== curCol;
  curCol = col;
  curRegion = Math.max(0, +region || 0);
  if (colChanged) mountPanes(col);
  else for (const p of panes) p.setRegion(curRegion);
  renderState();
}

bus.on('select', p => {
  if (!p || p.page == null || p.region == null) return;
  selActive = true;
  retarget(p.page, +p.region);
});
bus.on('select:clear', () => { selActive = false; });
bus.on('view', p => {
  if (!p || !p.page || p.page === curCol || selActive) return;
  retarget(p.page, regionsOf(p.page).length > 1 ? 1 : 0);
});
bus.on('layer', p => {
  if (p && p.page === curCol && p.name === 'source' && p.status === 'ready') renderState();
});

function step(d) {
  const regs = regionsOf(curCol);
  if (!regs.length) return;
  const n = Math.max(0, Math.min(regs.length - 1, curRegion + d));
  if (n !== curRegion) viewer.select(curCol, n);
}
$('#rwPrev').onclick = () => step(-1);
$('#rwNext').onclick = () => step(1);

/* ---------- sections: collapse per-section, persisted ---------- */
const KSEC = 'whl-ews-secs', KTAB = 'whl-ews-tab', KGEO = 'whl-ews-geom';
let SEC = { xl: 1, tx: 1, hi: 0 };
try { SEC = { ...SEC, ...(JSON.parse(sessionStorage.getItem(KSEC) || 'null') || {}) }; } catch {}
const put = (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} };
document.querySelectorAll('#rwSecs .sec').forEach(s =>
  s.classList.toggle('closed', !SEC[s.dataset.k]));
$('#rwSecs').addEventListener('click', e => {
  const h = e.target.closest('.sec-h');
  if (!h) return;
  const s = h.closest('.sec');
  SEC[s.dataset.k] = s.classList.toggle('closed') ? 0 : 1;
  put(KSEC, SEC);
});

/* tabs (tabbed style) */
let tab = 'xl';
try { tab = JSON.parse(sessionStorage.getItem(KTAB) || '"xl"'); } catch {}
function applyTab() {
  document.querySelectorAll('#rwTabs button').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('#rwSecs .sec').forEach(s =>
    s.classList.toggle('tab-active', s.dataset.k === tab));
}
$('#rwTabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  tab = b.dataset.tab; applyTab(); put(KTAB, tab);
});
applyTab();

/* ---------- geometry: styles, drag, resize, dock, persist ---------- */
const win = $('#rw'), head = $('#rwHead'), rz = $('#rwResize'), prevEl = $('#dockPrev');
let W = { x: -1, y: -1, w: 380, h: 340, style: 'frosted', prevStyle: 'frosted' };
try {
  const s = JSON.parse(sessionStorage.getItem(KGEO) || 'null');
  if (s && typeof s === 'object') W = { ...W, ...s };
  if (!STYLES.includes(W.style)) W.style = 'frosted';
} catch {}

const topMin = () => chrome.el.getBoundingClientRect().bottom + 8;
function applyW() {
  const vw = innerWidth, vh = innerHeight, ty = topMin();
  if (W.style === 'docked') {
    Object.assign(win.style, { left: (vw - DOCK_W) + 'px', top: ty + 'px',
      width: DOCK_W + 'px', height: (vh - ty) + 'px' });
  } else {
    W.w = Math.max(320, Math.min(W.w, vw - 16));
    W.h = Math.max(180, Math.min(W.h, vh - ty - 8));
    if (W.x < 0 && W.y < 0) { W.x = vw - W.w - 20; W.y = ty + 4; }
    W.x = Math.max(8, Math.min(W.x, vw - W.w - 8));
    W.y = Math.max(ty, Math.min(W.y, vh - 44));
    Object.assign(win.style, { left: W.x + 'px', top: W.y + 'px',
      width: W.w + 'px', height: W.h + 'px' });
  }
  win.dataset.style = W.style;
  document.querySelectorAll('#rwSeg button')
    .forEach(b => b.classList.toggle('active', b.dataset.s === W.style));
}
const save = () => put(KGEO, W);

function setStyle(s) {
  if (!STYLES.includes(s) || s === W.style) return;
  if (s === 'docked' && W.style !== 'docked') W.prevStyle = W.style;
  W.style = s;
  applyW(); save();
}
$('#rwSeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-s]');
  if (b) setStyle(b.dataset.s);
});

const showPreview = on => {
  if (on && prevEl.hidden) {
    const ty = topMin();
    prevEl.style.top = ty + 'px'; prevEl.style.height = (innerHeight - ty) + 'px';
  }
  prevEl.hidden = !on;
};

let drag = null;
head.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('button')) return;
  drag = { dx: e.clientX - W.x, dy: e.clientY - W.y, sx: e.clientX, id: e.pointerId };
  try { head.setPointerCapture(e.pointerId); } catch {}
  win.classList.add('dragging');
});
head.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (W.style === 'docked') {
    if (drag.sx - e.clientX > 80) {                 /* >80px off the edge: undock */
      W.style = W.prevStyle || 'frosted';
      W.x = e.clientX - W.w / 2; W.y = e.clientY - 14;
      drag.dx = e.clientX - W.x; drag.dy = e.clientY - W.y;
      applyW();
    }
    return;
  }
  W.x = e.clientX - drag.dx; W.y = e.clientY - drag.dy;
  showPreview(e.clientX >= innerWidth - 24);        /* near right edge: dock preview */
  applyW();
});
function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  drag = null; win.classList.remove('dragging');
  if (!prevEl.hidden) { showPreview(false); if (W.style !== 'docked') setStyle('docked'); }
  save();
}
head.addEventListener('pointerup', endDrag);
head.addEventListener('pointercancel', endDrag);

let rs = null;
rz.addEventListener('pointerdown', e => {
  if (e.button !== 0 || W.style === 'docked') return;
  rs = { dw: W.w - e.clientX, dh: W.h - e.clientY, id: e.pointerId };
  try { rz.setPointerCapture(e.pointerId); } catch {}
  win.classList.add('dragging');
  e.preventDefault();
});
rz.addEventListener('pointermove', e => {
  if (!rs || e.pointerId !== rs.id) return;
  W.w = e.clientX + rs.dw; W.h = e.clientY + rs.dh;
  applyW();
});
const endRs = () => { if (!rs) return; rs = null; win.classList.remove('dragging'); save(); };
rz.addEventListener('pointerup', endRs);
rz.addEventListener('pointercancel', endRs);

window.addEventListener('resize', applyW);
applyW(); save();

/* ---------- pin: freeze a static copy, respawn the active window ---------- */
let frozen = null;
function pinActive() {
  if (frozen) { frozen.remove(); frozen = null; }   /* max 2: replace the frozen one */
  const r = win.getBoundingClientRect();
  const c = win.cloneNode(true);
  c.removeAttribute('id');
  c.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  c.classList.add('pinned'); c.classList.remove('dragging');
  const seg = c.querySelector('.rw-seg'); if (seg) seg.remove();
  const hnd = c.querySelector('.rw-resize'); if (hnd) hnd.remove();
  c.querySelectorAll('.stepbtn, .rw-tabs button').forEach(b => b.disabled = true);
  const pb = c.querySelector('.rw-pin');
  pb.textContent = 'Unpin';
  pb.addEventListener('click', () => { c.remove(); frozen = null; });
  Object.assign(c.style, { left: r.left + 'px', top: r.top + 'px',
    width: r.width + 'px', height: r.height + 'px' });
  const ch = c.querySelector('.rw-head');
  let fd = null;
  ch.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('button')) return;
    const b = c.getBoundingClientRect();
    fd = { dx: e.clientX - b.left, dy: e.clientY - b.top, id: e.pointerId };
    try { ch.setPointerCapture(e.pointerId); } catch {}
  });
  ch.addEventListener('pointermove', e => {
    if (!fd || e.pointerId !== fd.id) return;
    c.style.left = Math.max(8, e.clientX - fd.dx) + 'px';
    c.style.top = Math.max(topMin(), e.clientY - fd.dy) + 'px';
  });
  const fEnd = () => { fd = null; };
  ch.addEventListener('pointerup', fEnd);
  ch.addEventListener('pointercancel', fEnd);
  document.body.appendChild(c);
  frozen = c;
  if (W.style === 'docked') {                       /* frozen keeps the panel slot */
    W.style = W.prevStyle || 'frosted';
    W.x = r.left - W.w - 24; W.y = Math.max(topMin(), r.top + 24);
  } else { W.x += 24; W.y += 24; }
  applyW(); save();
}
$('#rwPin').onclick = pinActive;

/* ---------- keyboard: 1–4 styles, arrows pan, Esc clears ---------- */
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (/input|select|textarea/i.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') { viewer.next(); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { viewer.prev(); e.preventDefault(); }
  else if (e.key >= '1' && e.key <= '4') setStyle(STYLES[+e.key - 1]);
  else if (e.key === 'Escape') { showPreview(false); bus.emit('select:clear', {}); }
});

/* ---------- boot ---------- */
retarget(viewer.current() || 'col-0045', 1);

window.__whl = { bus, chrome, store, viewer, get panes() { return panes; } };
</script>
</body>
</html>
