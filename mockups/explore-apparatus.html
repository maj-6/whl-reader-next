<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore — Apparatus — WHL Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<style>
  html { --rail-h: 132px; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }

  /* chrome topbar → floating translucent bar over the full-bleed roll */
  .topbar {
    position: absolute; top: 12px; left: 12px; right: 12px; z-index: 60;
    border: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
    border-radius: var(--radius-lg);
    background: color-mix(in srgb, var(--bg-raise) 84%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: var(--shadow);
  }
  .mock-note { bottom: calc(var(--rail-h) + 10px); }

  /* ---- stage ---- */
  .stage { flex: 1; position: relative; min-height: 0; background: var(--bg-sunk); }
  #osd { position: absolute; inset: 0; }
  #osd .openseadragon-canvas:focus { outline: none; }

  /* ---- apparatus rail ---- */
  .rail { flex: none; height: var(--rail-h); display: flex; flex-direction: column;
    background: var(--bg-raise); border-top: 1px solid var(--line); }
  .grip { flex: none; height: 22px; position: relative; display: flex; align-items: center;
    gap: 12px; padding: 0 12px; cursor: row-resize; user-select: none; touch-action: none; }
  .grip::before { content: ""; position: absolute; left: 50%; top: 9px; width: 40px; height: 4px;
    transform: translateX(-50%); border-radius: 2px; background: var(--line-2); }
  .g-cap { font: 600 11px var(--font-chrome); letter-spacing: .02em; color: var(--ink-2);
    white-space: nowrap; }
  .g-zoom { margin-left: auto; display: flex; gap: 2px; }
  .g-zoom button { border: 0; background: none; cursor: pointer; padding: 0 6px;
    font: 500 13px/20px var(--font-chrome); color: var(--ink-3); }
  .g-zoom button:hover { color: var(--ink); }
  .rail.min .band, .rail.min .g-zoom { display: none; }

  .band { flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  .cnt { position: relative; height: 100%; }

  .ent { position: absolute; top: 0; bottom: 0; padding: 6px 10px 6px 11px;
    border-left: 1px solid var(--line); overflow: hidden; cursor: pointer;
    display: flex; flex-direction: column; gap: 3px; }
  .ent .chip { font: 600 11px var(--font-chrome); color: var(--ink-2); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; flex: none; }
  .ent .tr { font: 12.5px/1.45 var(--font-read); color: var(--ink-2); overflow: hidden;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--rail-lines, 3); }
  .ent:hover, .ent.hlC { background: var(--tint-region); }
  .ent.hlR { background: var(--tint-region); box-shadow: inset 0 2px 0 var(--line-2); }
  .ent.sel { background: var(--tint-select); }
  .ent.cur { box-shadow: inset 2px 0 0 var(--accent); }
  .ent.cur .chip { color: var(--ink); }
  .ent.empty { cursor: default; }
  .ent.empty .chip { color: var(--ink-3); font-weight: 400; }
</style>
</head>
<body>
<script>const _s=localStorage.getItem('whlnext-scheme')||'archive',_m=localStorage.getItem('whlnext-mode')||'light';document.documentElement.dataset.scheme=_s;document.documentElement.dataset.mode=_m;</script>

<div class="stage"><div id="osd"></div></div>

<div class="rail" id="rail" aria-label="Apparatus">
  <div class="grip" id="grip">
    <span class="g-cap" id="gcap">Columns 44–48 · Eb 214–262</span>
    <span class="g-zoom">
      <button type="button" id="zOut" aria-label="Rail zoom out">&minus;</button>
      <button type="button" id="zIn" aria-label="Rail zoom in">+</button>
    </span>
  </div>
  <div class="band" id="band"><div class="cnt" id="cnt"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/openseadragon@5.0/build/openseadragon/openseadragon.min.js"></script>
<script type="module">
import { createBus } from './lib/whl-bus.js';
import { mountChrome } from './lib/whl-chrome.js';
import { createRoll, COLS, DATA_COLS, romanCol } from './explore-common.js';

const $ = s => document.querySelector(s);
const bus = createBus();

mountChrome({
  title: 'Papyrus Ebers', back: 'explore-concepts.html',
  book: { label: 'EB01', title: 'Papyrus Ebers', thumb: 'assets/thumbs/EB01.jpg' },
  adv: false, mockSwitch: 'mode-only',
  note: 'Apparatus rail, lockstep with the roll — click an entry to zoom, drag its top edge to resize.',
});

/* rail listeners must be attached before createRoll (which starts loading) */
const band = $('#band'), cnt = $('#cnt'), railEl = $('#rail'), grip = $('#grip'), gcap = $('#gcap');
const built = new Set();
bus.on('layer', ({ page, name, status }) => {
  if (name === 'source' && status === 'ready') buildCol(page);
});

const { viewer, store } = createRoll({
  el: $('#osd'), bus,
  /* createRoll merges viewerOpts.profile over its scroll-h RTL defaults; the full
     profile is restated here only for explicitness */
  viewerOpts: { profile: { layout: 'scroll-h', direction: 'rtl', gap: 0, viewportEvents: true, zoom: { max: 3 } } },
});
bus.on('highlight', h => { viewer.applyHighlight(h); paintEntries(h); });

/* ---- world geometry (RTL: col 44 rightmost, x near 0; col 48 leftmost) ---- */
const RECTS = {}; let minX = Infinity, maxX = -Infinity;
for (const c of COLS) {
  const r = viewer.worldRect(c.key);
  RECTS[c.key] = r;
  minX = Math.min(minX, r.x); maxX = Math.max(maxX, r.x + r.w);
}
const totalW = maxX - minX;

/* ---- rail zoom: px per world unit ---- */
let S = 1400;
const px = wx => (wx - minX) * S;

/* ---- entries: chip + one-line translation, widthed by case share, laid RTL ---- */
const entries = [];   // { el, page, region, left, width, label }
const chipOf = lb => (lb && (lb.match(/Eb ?\d+[a-z]?/) || [])[0]) || '—';

function colCases(page) {
  const d = store.get(page);
  if (!d || !d.source) return null;
  return d.source.regions
    .map((r, i) => ({ i, r }))
    .filter(({ r }) => r.type !== 'header' && r.case_label);
}
function buildCol(page) {
  if (built.has(page)) return;
  const cases = colCases(page);
  if (!cases || !cases.length) return;
  built.add(page);
  const wr = RECTS[page];
  const total = cases.reduce((a, { r }) => a + (r.box[3] - r.box[1]), 0) || 1;
  let cum = 0;
  for (const { i, r } of cases) {
    const share = (r.box[3] - r.box[1]) / total;
    const el = document.createElement('div');
    el.className = 'ent';
    el.dataset.p = page; el.dataset.r = i;
    el.innerHTML = `<span class="chip"></span><span class="tr"></span>`;
    el.firstChild.textContent = chipOf(r.case_label);
    el.lastChild.textContent = (r.translation || '').trim();
    el.addEventListener('pointerenter', () => bus.emit('hover', { src: 'text', page, region: i }));
    el.addEventListener('pointerleave', () => bus.emit('hover:clear', {}));
    el.addEventListener('click', () => viewer.select(page, i));
    cnt.appendChild(el);
    // reading order top→bottom maps right→left inside the column span (RTL mirror)
    entries.push({ el, page, region: i, fRight: cum, fW: share, wr, label: chipOf(r.case_label) });
    cum += share;
  }
  layout();
  markCenter();
}
/* col-0047 has no layers: its span is an empty stretch with a single em-dash entry */
{
  const wr = RECTS['col-0047'];
  const el = document.createElement('div');
  el.className = 'ent empty';
  el.innerHTML = `<span class="chip">—</span>`;
  cnt.appendChild(el);
  entries.push({ el, page: 'col-0047', region: null, fRight: 0, fW: 1, wr, label: '—' });
}

function layout() {
  cnt.style.width = (totalW * S).toFixed(1) + 'px';
  for (const e of entries) {
    const colL = px(e.wr.x), colW = e.wr.w * S;
    e.left = colL + colW * (1 - e.fRight - e.fW);
    e.width = colW * e.fW;
    e.el.style.left = e.left.toFixed(1) + 'px';
    e.el.style.width = e.width.toFixed(1) + 'px';
  }
}
layout();

function paintEntries(h) {
  const w = h && h.regions;
  for (const e of entries) {
    if (e.region == null) continue;
    const wt = w && w.get ? w.get(e.page + '/' + e.region) : null;
    e.el.classList.toggle('hlC', wt === 'hlC');
    e.el.classList.toggle('hlR', wt === 'hlR');
    e.el.classList.toggle('sel', wt === 'sel');
  }
}

/* ---- lockstep: viewer viewport → rail scroll; rail scroll → viewer column ---- */
let selfUntil = 0, scrollT = 0, centerRaf = 0;
function followViewport(v) {
  const c = px(v.x + v.w / 2) - band.clientWidth / 2;
  selfUntil = performance.now() + 140;
  band.scrollLeft = c;
  markCenter();
}
bus.on('viewport', v => followViewport(v));

band.addEventListener('scroll', () => {
  if (!centerRaf) centerRaf = requestAnimationFrame(() => { centerRaf = 0; markCenter(); });
  if (performance.now() < selfUntil) return;
  clearTimeout(scrollT);
  scrollT = setTimeout(() => {                    // user-driven: pan the roll (column-granular)
    const wx = minX + (band.scrollLeft + band.clientWidth / 2) / S;
    let best = null, bd = Infinity;
    for (const c of COLS) {
      const r = RECTS[c.key], d = Math.abs(wx - (r.x + r.w / 2));
      if (d < bd) { bd = d; best = c.key; }
    }
    if (best && best !== viewer.current()) viewer.goto(best);
  }, 180);
}, { passive: true });

/* entry under the viewport center: left accent + declarative caption */
function markCenter() {
  const c = band.scrollLeft + band.clientWidth / 2;
  let hit = null;
  for (const e of entries) if (e.left != null && c >= e.left && c < e.left + e.width) { hit = e; break; }
  for (const e of entries) e.el.classList.toggle('cur', e === hit);
  if (hit) {
    const n = +hit.page.slice(4);
    gcap.textContent = hit.region == null
      ? `Column ${n} · ${romanCol(hit.page)}`
      : `Column ${n} · ${hit.label}`;
  }
}

/* initial centering once the viewer reports geometry */
(function init(n) {
  const v = viewer.viewportInfo();
  if (v) followViewport(v);
  else if (n < 90) requestAnimationFrame(() => init(n + 1));
})(0);

/* ---- rail zoom controls ---- */
function setS(s) {
  const wx = minX + (band.scrollLeft + band.clientWidth / 2) / S;   // keep center stable
  S = Math.max(700, Math.min(3200, s));
  layout();
  selfUntil = performance.now() + 140;
  band.scrollLeft = px(wx) - band.clientWidth / 2;
  markCenter();
}
$('#zIn').onclick = () => setS(S * 1.3);
$('#zOut').onclick = () => setS(S / 1.3);

/* ---- splitter: drag the rail's top edge; 0 leaves a 22px grab tab ---- */
let wantH = 132;                                   // intended height, survives re-clamps
function setRailH(req) {
  wantH = req < 48 ? 22 : Math.round(req);         // grab tab only below the snap point
  const max = Math.max(64, Math.round(window.innerHeight * 0.40));
  const h = Math.min(max, wantH);
  document.documentElement.style.setProperty('--rail-h', h + 'px');
  railEl.classList.toggle('min', h <= 22);
  const lines = Math.max(1, Math.floor((h - 22 - 12 - 19) / 18));
  document.documentElement.style.setProperty('--rail-lines', lines);
}
setRailH(132);
grip.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { grip.setPointerCapture(e.pointerId); } catch { }
  const move = ev => setRailH(window.innerHeight - ev.clientY + 11);
  const up = () => {
    grip.removeEventListener('pointermove', move);
    grip.removeEventListener('pointerup', up);
    const v = viewer.viewportInfo(); if (v) followViewport(v);
  };
  grip.addEventListener('pointermove', move);
  grip.addEventListener('pointerup', up);
});
window.addEventListener('resize', () => {
  setRailH(wantH);
  const v = viewer.viewportInfo(); if (v) followViewport(v);
});

/* ---- keyboard ---- */
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') { viewer.next(); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { viewer.prev(); e.preventDefault(); }
  else if (e.key === 'Escape') bus.emit('select:clear', {});
});

/* any columns whose source layer landed before our listener */
for (const k of DATA_COLS) {
  const d = store.get(k);
  if (d && d.source) buildCol(k);
}
</script>
</body>
</html>
