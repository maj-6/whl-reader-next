<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EB01 Scroll Reader — WHL Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }

  /* ---- topbar extras (inserted into chrome.el) ---- */
  .col-ind { display: flex; align-items: center; gap: 8px; padding: 4px 12px;
    border: 1px solid var(--line); border-radius: 99px; background: var(--bg);
    white-space: nowrap; }
  .col-ind .ci-col { font: 600 12px var(--font-chrome); color: var(--ink); }
  .col-ind .ci-ebs { font: 12px var(--font-chrome); color: var(--ink-3); }
  .ci-dots { display: inline-flex; gap: 4px; align-items: center; }
  .ci-dots .ld { width: 7px; height: 7px; border-radius: 50%; background: transparent;
    border: 1px solid var(--line-2); }
  .ci-dots .ld[data-st="loading"] { background: var(--warn); border-color: var(--warn);
    animation: pulse 1.1s infinite; }
  .ci-dots .ld[data-st="ready"] { background: var(--ok); border-color: var(--ok); }
  .ci-dots .ld[data-st="error"] { background: var(--rubric); border-color: var(--rubric); }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (max-width: 1080px) { .col-ind .ci-ebs { display: none; } }

  /* ---- stage ---- */
  .stage { flex: 1; display: flex; min-height: 0; }
  .viewwrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .osdwrap { flex: 1; position: relative; min-height: 0; }
  #osd { position: absolute; inset: 0; }
  #osd .openseadragon-canvas:focus { outline: none; }

  /* floating chrome over the facsimile */
  .float-tr { position: absolute; top: 12px; right: 14px; z-index: 6;
    display: flex; gap: 8px; align-items: center; }
  .float-tr .btn { border-radius: 99px; font-size: 11.5px; padding: 5px 12px; opacity: .95; }

  /* the roll reads right-to-left: NEXT pans left, so it sits on the LEFT */
  .navbtn { position: absolute; top: 44%; z-index: 6; display: flex; flex-direction: column;
    align-items: center; gap: 1px; padding: 9px 11px 7px; cursor: pointer;
    background: var(--bg-raise); border: 1px solid var(--line); border-radius: 22px;
    box-shadow: var(--shadow); color: var(--ink); opacity: .94; }
  .navbtn:hover { border-color: var(--accent); }
  .navbtn .arr { font: 400 20px/0.9 var(--font-display); }
  .navbtn .cap { font: 600 8.5px var(--font-chrome); letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-3); }
  .navbtn.next { left: 14px; }
  .navbtn.prev { right: 14px; }
  .navbtn[disabled] { opacity: .35; cursor: default; }
  .navbtn[disabled]:hover { border-color: var(--line); }

  /* one-time prefetch toast */
  .toast { position: absolute; right: 14px; bottom: 12px; z-index: 7;
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-raise); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 7px 12px; font: 12px var(--font-chrome); color: var(--ink-2);
    opacity: 0; transform: translateY(6px); transition: opacity .35s, transform .35s;
    pointer-events: none; }
  .toast.show { opacity: .96; transform: none; }
  .toast .tdot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn);
    animation: pulse 1s infinite ease-in-out; }

  /* ---- docked reading strip ---- */
  .strip { flex: none; max-height: 44%; display: flex; flex-direction: column;
    background: var(--bg-raise); border-top: 1px solid var(--line); }
  .strip.collapsed .strip-clip { display: none; }
  .strip-head { display: flex; align-items: center; gap: 10px; padding: 7px 16px;
    border-bottom: 1px solid var(--line); flex: none; }
  .strip.collapsed .strip-head { border-bottom: 0; }
  .s-col { border: 0; background: none; padding: 0; cursor: pointer; text-align: left;
    font: 600 15px var(--font-display); color: var(--ink); white-space: nowrap; }
  .s-col:hover { color: var(--accent); }
  .s-ebs { font: 12px var(--font-chrome); color: var(--ink-3); white-space: nowrap; }
  .s-div { width: 1px; height: 18px; background: var(--line); flex: none; }
  .stepper { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .stepbtn { border: 1px solid var(--line-2); background: var(--bg-raise); color: var(--ink-2);
    border-radius: var(--radius); width: 24px; height: 24px; cursor: pointer;
    font: 13px/1 var(--font-chrome); padding: 0; }
  .stepbtn:hover { border-color: var(--accent); color: var(--ink); }
  .stepbtn[disabled] { opacity: .35; cursor: default; }
  .stepbtn[disabled]:hover { border-color: var(--line-2); color: var(--ink-2); }
  .s-case { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .s-count { font: 11px var(--font-chrome); color: var(--ink-3); white-space: nowrap; }
  .strip-head .spacer { flex: 1; }
  .layseg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius);
    overflow: hidden; background: var(--bg-raise); }
  .layseg button { border: 0; background: none; padding: 4px 11px; cursor: pointer;
    font: 11.5px var(--font-chrome); color: var(--ink-2); }
  .layseg button.active { background: var(--tint-select); color: var(--ink); font-weight: 600; }
  .strip-clip { flex: 1; min-height: 0; overflow-y: auto; }
  .strip-clip > #stripText { max-width: 940px; margin: 0 auto; padding: 6px 16px 14px; }
  #stripText .tx { font-style: italic; }
  #stripText .tx, #stripText .xl { font-size: var(--read-size, 16.5px); }
  .strip-msg { max-width: 940px; margin: 0 auto; padding: 18px 16px 22px;
    font: 14px/1.6 var(--font-read); color: var(--ink-3); }

  /* ---- sidebar + rail ---- */
  .sidebar[hidden] { display: none !important; }
  .rail { width: 46px; flex: none; background: var(--bg-raise); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; padding: 10px 0 12px; gap: 6px; }
  .railbtn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    border: 1px solid transparent; border-radius: var(--radius); background: none; cursor: pointer;
    color: var(--ink-2); font-size: 15px; }
  .railbtn:hover { background: var(--tint-region); color: var(--ink); }
  .railbtn.active { background: var(--tint-select); color: var(--ink); border-color: var(--line-2); }
  .railbtn.r-aa { font: 600 13px var(--font-display); }

  /* column map (page-rendered, prepended into the Contents panel) */
  .colmap { display: flex; gap: 1px; height: 26px; align-items: flex-end; margin: 4px 0 5px; }
  .colmap .bar { flex: 1; min-width: 1px; height: 12px; background: var(--line); border-radius: 1px; }
  .colmap .bar.win { height: 20px; background: var(--ink-3); cursor: pointer; }
  .colmap .bar.win:hover { background: var(--ink-2); }
  .colmap .bar.cur { height: 26px; background: var(--accent); }
  .mapmeta { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-3); }
  .maplegend { font-size: 11px; color: var(--ink-3); margin-top: 6px; line-height: 1.45; }
</style>
</head>
<body>
<script>const _s=localStorage.getItem('whlnext-scheme')||'archive',_m=localStorage.getItem('whlnext-mode')||'light';document.documentElement.dataset.scheme=_s;document.documentElement.dataset.mode=_m;</script>

<div class="stage">
  <div class="viewwrap">
    <div class="osdwrap">
      <div id="osd"></div>
      <div class="float-tr">
        <button type="button" class="btn adv-only" id="glyphBtn"
          title="Glyph boxes, current column">&#9707; glyph boxes</button>
      </div>
      <button type="button" class="navbtn next" id="btnNext" title="Next column">
        <span class="arr">&lsaquo;</span><span class="cap">next</span></button>
      <button type="button" class="navbtn prev" id="btnPrev" title="Previous column">
        <span class="arr">&rsaquo;</span><span class="cap">prev</span></button>
      <div class="toast" id="toast"><span class="tdot"></span><span id="toastTxt"></span></div>
    </div>

    <section class="strip" id="strip" aria-label="Reading strip">
      <div class="strip-head">
        <button type="button" class="s-col" id="sCol" title="Fit column">Column —</button>
        <span class="s-ebs" id="sEbs"></span>
        <span class="s-div"></span>
        <div class="stepper">
          <button type="button" class="stepbtn" id="casePrev" title="Previous case">&lsaquo;</button>
          <span class="chip s-case" id="sCase">&hellip;</span>
          <button type="button" class="stepbtn" id="caseNext" title="Next case">&rsaquo;</button>
          <span class="s-count" id="sCount"></span>
        </div>
        <span class="spacer"></span>
        <div class="layseg" id="laySeg">
          <button type="button" data-lay="strip" class="active">Line</button>
          <button type="button" data-lay="stacked">Cases</button>
        </div>
        <button type="button" class="btn ghost" id="collapseBtn" title="Collapse reading strip">collapse &#9662;</button>
      </div>
      <div class="strip-clip">
        <div id="stripText"></div>
        <div class="strip-msg" id="stripMsg" hidden>&mdash;</div>
      </div>
    </section>
  </div>

  <aside id="sidebar" hidden aria-label="Sidebar"></aside>
  <nav class="rail" id="rail" aria-label="Sidebar rail">
    <button type="button" class="railbtn" data-tab="contents" title="Contents">&#9776;</button>
    <button type="button" class="railbtn" data-tab="thispage" title="On this column">&#9672;</button>
    <button type="button" class="railbtn r-aa" data-tab="appearance" title="Appearance">Aa</button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/openseadragon@5.0/build/openseadragon/openseadragon.min.js"></script>
<script type="module">
import {createBus} from './lib/whl-bus.js';
import {mountChrome} from './lib/whl-chrome.js';
import {createStore} from './lib/whl-store.js';
import {createViewer} from './lib/whl-viewer.js';
import {createTextPane} from './lib/whl-text.js';
import {createLinker} from './lib/whl-linker.js';
import {createSidebar} from './lib/whl-sidebar.js';
import {COLS, DATA_COLS} from './explore-common.js';

const $ = s => document.querySelector(s);
const bus = createBus();

/* ---------- column facts (from the extracted corpus layers) ---------- */
const COLINFO = [
  { key: 'col-0044', n: 44, ebs: 'Eb 214–225',  cases: 12 },
  { key: 'col-0045', n: 45, ebs: 'Eb 225–238',  cases: 13 },
  { key: 'col-0046', n: 46, ebs: 'Eb 237–245',  cases: 9  },
  { key: 'col-0047', n: 47, ebs: 'Eb 246?–251?', cases: 0, noData: true },
  { key: 'col-0048', n: 48, ebs: 'Eb 251d–262', cases: 12 },
];
const KEYS = COLINFO.map(c => c.key);
const INFO = {}; COLINFO.forEach(c => { INFO[c.key] = c; });
const LAYERS = ['tiles', 'source', 'glyphs', 'associations', 'entities'];
const START = 'col-0044';

/* ---------- chrome ---------- */
const chrome = mountChrome({
  title: 'Scroll reader', back: 'index.html', bus,
  book: { label: 'EB01 · hieratic roll, c. 1550 BC', title: 'Papyrus Ebers', thumb: 'assets/thumbs/EB01.jpg' },
  note: 'Continuous RTL roll, columns 44–48; ←/→ pan columns, ↑/↓ step cases; column 47 facsimile-only.'
});

/* topbar column indicator: "col NN · Eb range" + adv-only layer dots (page-rendered per API.md) */
const ind = document.createElement('div');
ind.className = 'col-ind';
ind.innerHTML = `<span class="ci-col" id="ciCol">col —</span><span class="ci-ebs" id="ciEbs"></span>` +
  `<span class="ci-dots adv-only" id="ciDots">` +
  LAYERS.map(l => `<span class="ld" data-l="${l}" title="${l}"></span>`).join('') + `</span>`;
chrome.el.insertBefore(ind, chrome.el.querySelector('.advtog'));

/* ---------- store (the four ingested columns; col-0047 will surface errors) ---------- */
const store = createStore({ base: 'lib/data', book: 'EB01', bus, pages: DATA_COLS, latency: '3g' });

/* ---------- viewer: five columns, one seamless RTL world (col 44 rightmost) ---------- */
const viewer = createViewer({
  el: $('#osd'), bus, store, book: 'EB01',
  profile: { layout: 'scroll-h', direction: 'rtl', gap: 0, zoom: { max: 3 } },
  pages: COLS, start: START,
});

/* ---------- linker + highlight fan-out ---------- */
createLinker({ bus, store });
let lastH = null, glyphsOn = false;
bus.on('highlight', h => {
  lastH = h;
  viewer.applyHighlight(h);
  if (stripPane) stripPane.applyHighlight(h);
});

/* glyph boxes: passive outline layer on the current column (lib setWordBoxes) */
const glyphBtn = $('#glyphBtn');
function setGlyphs(on) {
  glyphsOn = on;
  glyphBtn.classList.toggle('active', on);
  if (curCol) viewer.setWordBoxes(curCol, on);
}
glyphBtn.onclick = () => {
  if (document.documentElement.dataset.adv !== '1') return; // adv-only control
  setGlyphs(!glyphsOn);
};
bus.on('adv', ({ on }) => {           // leaving Advanced also clears the glyph layer
  if (!on && glyphsOn) setGlyphs(false);
});

/* ---------- reading strip: whl-text pane for the current column ---------- */
let stripPane = null, stripLayout = 'strip', curCol = null, curRegion = 0;
const stripEl = $('#stripText'), stripMsg = $('#stripMsg');
function mountStrip(col) {
  if (stripPane) { stripPane.destroy(); stripPane = null; }
  stripEl.innerHTML = '';
  const noData = INFO[col] && INFO[col].noData;
  stripMsg.hidden = !noData;
  stripEl.hidden = !!noData;
  if (noData) return;
  stripPane = createTextPane({ el: stripEl, bus, store, book: 'EB01', page: col, layout: stripLayout });
  if (lastH) stripPane.applyHighlight(lastH);
  if (stripLayout === 'stacked') stripPane.scrollTo(curRegion, { instant: true });
}
$('#laySeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-lay]');
  if (!b || b.dataset.lay === stripLayout) return;
  stripLayout = b.dataset.lay;
  document.querySelectorAll('#laySeg button').forEach(x => x.classList.toggle('active', x === b));
  if (stripPane) { stripPane.setLayout(stripLayout); if (stripLayout === 'stacked') stripPane.scrollTo(curRegion, { instant: true }); }
});
const stripBox = $('#strip'), collapseBtn = $('#collapseBtn');
collapseBtn.onclick = () => {
  const c = stripBox.classList.toggle('collapsed');
  collapseBtn.innerHTML = c ? 'expand &#9652;' : 'collapse &#9662;';
};

/* case stepper — nav events, so the facsimile pans to the case as you step */
const regionsOf = col => (store.get(col) && store.get(col).source && store.get(col).source.regions) || [];
function stepCase(d) {
  const regs = regionsOf(curCol);
  if (!regs.length) return;
  const n = Math.max(0, Math.min(regs.length - 1, curRegion + d));
  if (n !== curRegion) bus.emit('nav', { page: curCol, region: n });
}
$('#casePrev').onclick = () => stepCase(-1);
$('#caseNext').onclick = () => stepCase(1);
$('#sCol').onclick = () => bus.emit('nav', { page: curCol }); // refit whole column

/* ---------- sidebar (collapsed to a rail by default) ---------- */
const TREE = COLINFO.map(c => ({
  id: c.key, title: 'Column ' + c.n,
  sub: c.noData ? 'facsimile only' : c.ebs + ' · ' + c.cases + ' cases',
  target: { page: c.key },
}));
const side = createSidebar({ el: $('#sidebar'), bus, tabs: {
  contents: { title: 'Loaded columns', tree: TREE },
  thispage: { label: 'This column', title: 'This column', items: [] },
  appearance: true,
}});

/* column map: 110 columns of the roll, RTL (col 1 rightmost); 44–48 active */
const mapSec = document.createElement('div');
mapSec.className = 'side-sec';
mapSec.innerHTML = `<h4>Column map · 110 columns</h4>
  <div class="mapmeta"><span>col 110 · end</span><span>col 1 · start</span></div>
  <div class="colmap" id="colmap"></div>
  <div class="maplegend">Columns 44–48 loaded.</div>`;
side.el.querySelector('.side-panel').prepend(mapSec); // contents is the first panel
const colmap = mapSec.querySelector('#colmap');
for (let n = 110; n >= 1; n--) {
  const b = document.createElement('div');
  const key = 'col-' + String(n).padStart(4, '0');
  b.className = 'bar' + (INFO[key] ? ' win' : '');
  b.dataset.key = key;
  b.title = 'Column ' + n;
  colmap.appendChild(b);
}
colmap.onclick = e => {
  const key = e.target.dataset && e.target.dataset.key;
  if (key && INFO[key]) bus.emit('nav', { page: key });
};

/* rail: toggles the sidebar open/closed on a tab */
const rail = $('#rail'), sidebarEl = $('#sidebar');
let openTab = null;
rail.querySelectorAll('.railbtn').forEach(b => b.onclick = () => {
  const t = b.dataset.tab;
  if (openTab === t) { sidebarEl.hidden = true; openTab = null; }
  else { sidebarEl.hidden = false; side.open(t); openTab = t; }
  rail.querySelectorAll('.railbtn').forEach(x => x.classList.toggle('active', x.dataset.tab === openTab));
});

/* this-column entity cards from the real entities layer */
const itemsFrom = ents => {
  const main = ents.filter(e => e.type !== 'citation');
  const cites = ents.filter(e => e.type === 'citation').slice(0, 3);
  return [...main, ...cites].map(en => ({
    kind: en.type === 'citation' ? 'citation' : 'entity',
    entity: en,
    relevance: Math.min(1, ((en.mentions && en.mentions.length) || 0) / 4),
    body: en.summary,
  }));
};
function refreshThisCol(col) {
  const pd = store.get(col);
  side.setThisPage(itemsFrom((pd && Array.isArray(pd.entities)) ? pd.entities : []));
}

/* ---------- toast + neighbour prefetch ---------- */
const toast = $('#toast');
let toastTimer = 0, toastShown = false;
function showToast(msg) {
  $('#toastTxt').textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
}
function ensureNeighbors(col, silent) {
  const i = KEYS.indexOf(col);
  for (const k of [KEYS[i + 1], KEYS[i - 1]]) {
    if (!k || Object.keys(store.status(k)).length) continue;
    store.prefetch(k);
    if (!silent && !toastShown) {
      toastShown = true;
      showToast('fetching col ' + INFO[k].n + ' layers…');
    }
  }
}

/* ---------- shared render ---------- */
function renderDots() {
  const st = store.status(curCol);
  document.querySelectorAll('#ciDots .ld').forEach(d => {
    const s = st[d.dataset.l];
    if (s) d.dataset.st = s; else delete d.dataset.st;
  });
}
function renderState() {
  const c = INFO[curCol] || {};
  $('#ciCol').textContent = 'col ' + (c.n || '—');
  $('#ciEbs').textContent = c.noData ? 'facsimile only' : (c.ebs || '');
  $('#sCol').textContent = 'Column ' + (c.n || '—');
  $('#sEbs').textContent = c.noData ? 'facsimile only' : (c.ebs || '');
  const regs = regionsOf(curCol), r = regs[curRegion];
  $('#sCase').textContent = r ? (r.case_label || (r.type === 'header' ? 'column header' : 'case')) :
    (c.noData ? '—' : '…');
  $('#sCount').textContent = regs.length ? (curRegion + 1) + ' / ' + regs.length : '';
  $('#casePrev').disabled = !regs.length || curRegion <= 0;
  $('#caseNext').disabled = !regs.length || curRegion >= regs.length - 1;
  const i = KEYS.indexOf(curCol);
  $('#btnNext').disabled = i >= KEYS.length - 1;
  $('#btnPrev').disabled = i <= 0;
  colmap.querySelectorAll('.bar.cur').forEach(b => b.classList.remove('cur'));
  const cb = colmap.querySelector(`.bar[data-key="${curCol}"]`);
  if (cb) cb.classList.add('cur');
  renderDots();
}

/* ---------- view changes drive everything ---------- */
function setCol(page, boot) {
  if (!page || page === curCol) return;
  if (glyphsOn && curCol) viewer.setWordBoxes(curCol, false); // box layer follows the column
  curCol = page; curRegion = 0;
  store.load(page);                 // cached no-op for known cols; errors for col-0047
  mountStrip(page);
  refreshThisCol(page);
  if (glyphsOn) viewer.setWordBoxes(page, true);
  renderState();
  ensureNeighbors(page, !!boot);    // toast is reserved for real view changes
}
bus.on('view', p => setCol(p && p.page));
bus.on('nav', p => {
  if (!p || p.page !== curCol || p.region == null) return;
  curRegion = +p.region; renderState();
});
bus.on('select', p => {
  if (!p || p.page !== curCol || p.region == null) return;
  curRegion = +p.region; renderState();
});
bus.on('layer', p => {
  if (!p || p.page !== curCol) return;
  renderDots();
  if (p.status !== 'ready') return;
  if (p.name === 'entities') refreshThisCol(curCol);
  if (p.name === 'source') renderState();
});

/* ---------- nav buttons + keyboard (RTL semantics come from the viewer) ---------- */
$('#btnNext').onclick = () => viewer.next();
$('#btnPrev').onclick = () => viewer.prev();
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (/input|select|textarea/i.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') { viewer.next(); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { viewer.prev(); e.preventDefault(); }
  else if (e.key === 'ArrowDown') { stepCase(1); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { stepCase(-1); e.preventDefault(); }
  else if (e.key === 'Escape') bus.emit('select:clear', {});
});

/* ---------- boot ---------- */
setCol(viewer.current(), true);     // the viewer's own 'view' event confirms shortly after

/* debug handle */
window.__whl = { bus, chrome, store, viewer, side, get stripPane() { return stripPane; } };
</script>
</body>
</html>
