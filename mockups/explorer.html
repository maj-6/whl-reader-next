<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explorer — WHL Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<style>
  html, body { height: 100%; }
  body { overflow: hidden; }
  .stage { position: absolute; inset: 0; background: var(--bg-sunk); }
  #osd { position: absolute; inset: 0; }
  #osd .openseadragon-canvas { outline: none; }

  /* ---------- page-scoped appearance registers ----------
     Palettes, panel styles, translucency and typography live on the explorer
     root only; assets/tokens.css is untouched. Palette blocks are :root[data-pal]
     (0,2,0) and :root[data-pal][data-mode="dark"] (0,3,0) so they outrank every
     tokens.css selector including [data-mode="dark"][data-scheme="…"]. */
  :root { --panel-alpha: 88; --panel-blur: 12px; --panel-gap: 6px; --x-read: 14.5px; }

  .psurf { background: color-mix(in srgb, var(--bg-raise) calc(min(100, var(--panel-alpha)) * 1%), transparent);
    backdrop-filter: blur(var(--panel-blur)); -webkit-backdrop-filter: blur(var(--panel-blur)); }
  :root[data-pstyle="bordered"] .psurf { border-color: var(--line); box-shadow: none; }
  :root[data-pstyle="shaded"]   .psurf { border-color: color-mix(in srgb, var(--line) 55%, transparent); box-shadow: var(--shadow); }
  :root[data-pstyle="flat"]     .psurf { border-color: transparent; box-shadow: none; }

  :root[data-type="garamond"] { --font-read: "EB Garamond", Georgia, serif; --font-display: "EB Garamond", Georgia, serif; }
  :root[data-type="sans"]     { --font-read: "Inter", system-ui, sans-serif; --font-display: "Inter", system-ui, sans-serif; }

  :root[data-pal="olive"] {
    --bg:#cbd0b8; --bg-raise:#d8dcc6; --bg-sunk:#b6bca0;
    --ink:#232a19; --ink-2:#4b5439; --ink-3:#757d60;
    --line:#a9b092; --line-2:#8e9776;
    --accent:#4d6b2f; --accent-ink:#f2f5e6;
    --tint-translation:#c2c8ac; --tint-region:#4d6b2f1f; --tint-select:#4d6b2f3d;
    --ent-author:#2a5c96; --ent-plant:#2f6b3a; --ent-cite:#8a5a12; --ent-substance:#93315a;
    --rubric:#9c2b1c; --ok:#2f6b3a; --warn:#8a5a12; }
  :root[data-pal="olive"][data-mode="dark"] {
    --bg:#1d2117; --bg-raise:#262b1e; --bg-sunk:#151810;
    --ink:#dfe3d0; --ink-2:#adb49b; --ink-3:#7d8570;
    --line:#39402e; --line-2:#4d553e;
    --accent:#9cb977; --accent-ink:#1d2117;
    --tint-translation:#2b3022; --tint-region:#9cb9771f; --tint-select:#9cb97740;
    --ent-author:#86aee8; --ent-plant:#7fc194; --ent-cite:#d3a75f; --ent-substance:#d3809f;
    --rubric:#e07a62; --ok:#7fc194; --warn:#d3a75f; }

  :root[data-pal="ochre"] {
    --bg:#e0cfa8; --bg-raise:#ecdcb8; --bg-sunk:#cdb98d;
    --ink:#2b2113; --ink-2:#5a4a2e; --ink-3:#8a7550;
    --line:#c3ab7d; --line-2:#a89065;
    --accent:#8a5a12; --accent-ink:#f7efdd;
    --tint-translation:#d8c69f; --tint-region:#8a5a121f; --tint-select:#8a5a123d;
    --ent-author:#26548c; --ent-plant:#276139; --ent-cite:#7d4a08; --ent-substance:#8c2f55;
    --rubric:#a02c1e; --ok:#276139; --warn:#7d4a08; }
  :root[data-pal="ochre"][data-mode="dark"] {
    --bg:#241d12; --bg-raise:#2e2618; --bg-sunk:#19130a;
    --ink:#eadfc6; --ink-2:#b8a988; --ink-3:#8a7c60;
    --line:#443826; --line-2:#5b4b31;
    --accent:#d7a75c; --accent-ink:#241d12;
    --tint-translation:#332a1b; --tint-region:#d7a75c1f; --tint-select:#d7a75c40;
    --ent-author:#87aee8; --ent-plant:#7cbf90; --ent-cite:#d5a55f; --ent-substance:#d5809d;
    --rubric:#e0785f; --ok:#7cbf90; --warn:#d5a55f; }

  :root[data-pal="umber"] {
    --bg:#cdbca9; --bg-raise:#dacab7; --bg-sunk:#b4a08b;
    --ink:#251c14; --ink-2:#52402f; --ink-3:#806a55;
    --line:#b09880; --line-2:#977e65;
    --accent:#6b3f21; --accent-ink:#f2e9df;
    --tint-translation:#c4b19d; --tint-region:#6b3f2120; --tint-select:#6b3f2140;
    --ent-author:#28518a; --ent-plant:#2a6238; --ent-cite:#82500e; --ent-substance:#8d3055;
    --rubric:#9d2b1d; --ok:#2a6238; --warn:#82500e; }
  :root[data-pal="umber"][data-mode="dark"] {
    --bg:#221a14; --bg-raise:#2c231b; --bg-sunk:#17110c;
    --ink:#e6dbcd; --ink-2:#b5a693; --ink-3:#867868;
    --line:#413428; --line-2:#584735;
    --accent:#c08a5c; --accent-ink:#221a14;
    --tint-translation:#312720; --tint-region:#c08a5c1f; --tint-select:#c08a5c40;
    --ent-author:#87aee8; --ent-plant:#7cbf90; --ent-cite:#d5a55f; --ent-substance:#d5809d;
    --rubric:#e0785f; --ok:#7cbf90; --warn:#d5a55f; }

  :root[data-pal="slate"] {
    --bg:#c3c8cf; --bg-raise:#d1d6dd; --bg-sunk:#aab1ba;
    --ink:#1b1f24; --ink-2:#414851; --ink-3:#6b737d;
    --line:#a1a9b3; --line-2:#868f9b;
    --accent:#33506e; --accent-ink:#eef1f5;
    --tint-translation:#b9bfc8; --tint-region:#33506e1f; --tint-select:#33506e3d;
    --ent-author:#25518c; --ent-plant:#26603a; --ent-cite:#7f4d0d; --ent-substance:#8a2f56;
    --rubric:#992b1f; --ok:#26603a; --warn:#7f4d0d; }
  :root[data-pal="slate"][data-mode="dark"] {
    --bg:#191c21; --bg-raise:#222831; --bg-sunk:#101318;
    --ink:#dde2e8; --ink-2:#a8b0ba; --ink-3:#7a828d;
    --line:#2f3641; --line-2:#414a58;
    --accent:#8fa9c9; --accent-ink:#191c21;
    --tint-translation:#262d37; --tint-region:#8fa9c91f; --tint-select:#8fa9c940;
    --ent-author:#8bb0e8; --ent-plant:#7cbf95; --ent-cite:#d3a663; --ent-substance:#d382a1;
    --rubric:#e07b64; --ok:#7cbf95; --warn:#d3a663; }

  /* ---------- anchored chrome ---------- */
  body > .topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 60;
    border: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
  .bookswitch { display: flex; align-items: center; gap: 2px; margin-left: 2px; }
  .bookswitch a { font: 11px var(--font-chrome); color: var(--ink-3); text-decoration: none; padding: 3px 6px; border-radius: var(--radius); }
  .bookswitch a:hover { color: var(--ink); background: var(--tint-region); }
  .bookswitch a.cur { color: var(--ink); font-weight: 600; background: var(--tint-select); }

  /* ---- rails: anchored to the window edges ---- */
  .rail { position: absolute; bottom: 0; z-index: 50; display: flex; flex-direction: column; }
  .rail.left { left: 0; width: 250px; overflow: hidden; border: 0; border-right: 1px solid var(--line); border-radius: 0; }
  .rail.right { right: 0; background: none; border: 0; box-shadow: none; backdrop-filter: none; }
  .rail.collapsed { width: 36px !important; }
  .rail-head { flex: none; display: flex; padding: 3px; }
  .chev { border: 0; background: none; color: var(--ink-3); cursor: pointer; font: 14px/1 var(--font-chrome); padding: 5px 8px; border-radius: var(--radius); }
  .chev:hover, .stripbtn:hover { color: var(--ink); background: var(--tint-region); }
  .rail-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }
  .rail.collapsed .rail-body, .rail.collapsed .rs-grip, .rail.collapsed .mini-wrap,
  .rail.collapsed .lfind, .rail.collapsed .ls-grip, .sec.closed .sec-b { display: none; }
  .rail-strip { display: none; flex-direction: column; gap: 2px; align-items: center; padding: 2px 0; }
  .rail.collapsed .rail-strip { display: flex; }
  .stripbtn { border: 0; background: none; color: var(--ink-2); cursor: pointer; font: 11.5px/1 var(--font-chrome); padding: 6px 0; width: 28px; border-radius: var(--radius); }
  .stripbtn.cur { color: var(--ink); font-weight: 600; background: var(--tint-select); }
  .stripbtn.dim, .row.dim .r1 { color: var(--ink-3); font-weight: 400; }

  /* right sidebar: two joined panels, draggable division */
  .rpanel { position: relative; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    border: 0; border-left: 1px solid var(--line); border-radius: 0; }
  #rpTop { flex: 0 0 var(--rsplit, 58%); border-bottom: 1px solid var(--line); }
  #rpBot { flex: 1 1 auto; border-top: 1px solid var(--line); }
  .rpanel .sec { border-top: 0; }
  .rs-split { flex: 0 0 var(--panel-gap); position: relative; cursor: row-resize; touch-action: none; z-index: 6; }
  .rs-split::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; }
  .rs-split:hover::after { background: var(--accent); }
  .rail.right.collapsed .rs-split, .rail.right.collapsed #rpBot { display: none; }
  .rail.right.collapsed #rpTop { flex: 1 1 auto; border-bottom: 0; }

  /* collapsible sections */
  .sec { flex: none; display: flex; flex-direction: column; min-height: 0; border-top: 1px solid var(--line); }
  .sec:first-child { border-top: 0; }
  .sec-h { flex: none; display: flex; align-items: center; gap: 8px; padding: 7px 10px 6px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .sec-t { flex: 1; min-width: 0; font: 600 10.5px var(--font-chrome); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sec-h:hover .sec-t { color: var(--ink); }
  .cv { flex: none; color: var(--ink-3); font-size: 10px; transition: transform .15s ease; }
  .sec.closed .cv { transform: rotate(-90deg); }
  .sec-b { min-height: 0; overflow-y: auto; }
  .sec-grow { flex: 1 1 auto; }
  .sec-grow:not(.closed) { min-height: 80px; }
  .sec-grow .sec-b { flex: 1; }
  .sec-grow.closed { flex: 0 0 auto; }
  .rail-empty { padding: 6px 12px 10px; font: 12.5px var(--font-chrome); color: var(--ink-3); }

  /* ---- left rail: position miniature, filter, lists ---- */
  .mini-wrap { flex: none; padding: 8px 8px 7px; border-bottom: 1px solid var(--line); }
  .mini { position: relative; height: 132px; display: flex; align-items: center; justify-content: center;
    background: var(--bg-sunk); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; cursor: crosshair; touch-action: none; }
  .mini-in { position: relative; overflow: hidden; }
  .mini-cell { position: absolute; overflow: hidden; }
  .mini-cell img { position: absolute; display: block; }
  .mini-vp { position: absolute; left: 0; top: 0; width: 0; height: 0; border: 1.5px solid var(--accent);
    background: var(--tint-select); pointer-events: none; }
  .miniseg { display: flex; margin-top: 6px; border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; }
  .miniseg[hidden] { display: none; }
  .miniseg button { flex: 1; border: 0; background: none; padding: 3px 0; cursor: pointer; font: 10.5px var(--font-chrome); color: var(--ink-2); }
  .miniseg button.active { background: var(--tint-select); color: var(--ink); font-weight: 600; }
  .lfind { flex: none; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .lfind input { width: 100%; box-sizing: border-box; border: 1px solid var(--line-2); border-radius: var(--radius);
    background: color-mix(in srgb, var(--bg) 55%, transparent); color: var(--ink); font: 12px var(--font-chrome); padding: 4px 7px; }
  .lfind input:focus { outline: none; border-color: var(--accent); }
  .ls-grip { position: absolute; right: 0; top: 0; bottom: 0; width: 6px; cursor: ew-resize; touch-action: none; z-index: 5; }
  .ls-grip::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 2px; }
  .ls-grip:hover::after, .rs-grip:hover::after { background: var(--accent); }

  /* left rail rows */
  .row { display: block; padding: 5px 10px 5px 12px; cursor: pointer; border-left: 2px solid transparent; }
  .row[hidden] { display: none; }
  .row:hover { background: var(--tint-region); }
  .row.cur { border-left-color: var(--accent); background: var(--tint-region); }
  .row.sub { padding-left: 24px; }
  .row .r1 { display: block; font: 500 12.5px var(--font-chrome); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.cur .r1 { font-weight: 600; }
  .row .r2 { display: block; font: 11px var(--font-chrome); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* right sidebar */
  .rs-grip { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; cursor: ew-resize; touch-action: none; z-index: 7; }
  .rs-grip::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; }
  #txWrap { --read-size: var(--x-read, 14.5px); }
  #txWrap .whl-text .rg-el { padding: 10px 12px; }
  #txEmpty, #rwEmpty { padding: 12px; font: 14px/1.6 var(--font-read); color: var(--ink-3); }
  .hbtn { flex: none; border: 1px solid var(--line-2); background: none; color: var(--ink-2); border-radius: var(--radius); cursor: pointer; padding: 1px 7px 2px; font: 13px/1.4 "Noto Sans Egyptian Hieroglyphs","Segoe UI Historic",sans-serif; }
  .hbtn.on { background: var(--tint-select); border-color: var(--accent); color: var(--ink); }

  /* hieroglyph lines (toggle-gated); pair layout: they sit under the transliteration column */
  .hl-block { margin: 6px 0 2px; }
  .hl-line { display: flex; gap: 8px; align-items: baseline; padding: 1.5px 0; }
  .hl-ref { flex: none; font: 10px var(--font-chrome); color: var(--ink-3); }
  .hl-t { min-width: 0; font-family: "Noto Sans Egyptian Hieroglyphs","Segoe UI Historic",sans-serif; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
  /* the tx/xl division point is driven by --pair-tx/--pair-xl on #txPane (auto-balanced) */
  #txPane[data-layout="pair"] .rg-el { grid-template-columns: var(--pair-tx, 1fr) var(--pair-xl, 1fr); }
  #txPane[data-layout="pair"] .rg-el > .tx { grid-area: 2 / 1; }
  #txPane[data-layout="pair"] .rg-el > .hl-block { grid-area: 3 / 1; }
  #txPane[data-layout="pair"] .rg-el > .xl { grid-area: 2 / 2 / span 2; }

  .com { padding: 5px 12px 7px; }
  .com-h { font: 600 11.5px var(--font-chrome); color: var(--ink-2); }
  .com-t { font: 13px/1.55 var(--font-read); color: var(--ink-2); }
  .ent-row { padding: 5px 10px 6px; border-left: 2px solid var(--ec, var(--line-2)); margin: 2px 0 2px 12px; }
  .ent-row.ent-plant { --ec: var(--ent-plant); } .ent-row.ent-substance { --ec: var(--ent-substance); }
  .ent-row.ent-author { --ec: var(--ent-author); } .ent-row.ent-citation { --ec: var(--ent-cite); }
  .ent-lab { font: 600 12px var(--font-chrome); color: var(--ec, var(--ink)); }
  .ent-sum { font: 11.5px/1.45 var(--font-chrome); color: var(--ink-3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .qa { margin: 2px 12px 8px; font: 12.5px/1.5 var(--font-chrome); }
  .qa .q { color: var(--ink); font-weight: 500; }
  .qa .a { margin-top: 4px; padding-left: 8px; border-left: 2px solid var(--line-2); color: var(--ink-2); }
  .ask-in { display: flex; margin: 0 12px 10px; }
  .ask-in input { flex: 1; min-width: 0; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--bg-raise); color: var(--ink); font: 12.5px var(--font-chrome); padding: 6px 9px; transition: opacity .2s; }
  .ask-in input:disabled { opacity: .45; }
  .ask-in input:focus { outline: none; border-color: var(--accent); }

  /* ---- appearance control ---- */
  .apbtn { border: 1px solid var(--line-2); background: none; color: var(--ink-2); border-radius: var(--radius);
    cursor: pointer; font: 11px var(--font-chrome); padding: 3px 8px; }
  .apbtn:hover, .apbtn.on { color: var(--ink); border-color: var(--accent); }
  .ap { position: absolute; z-index: 70; right: 10px; width: 280px; padding: 10px 12px 12px;
    border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
  .ap[hidden] { display: none !important; }
  .ap-r { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  .ap-r:first-child { margin-top: 0; }
  .ap-l { flex: 0 0 54px; font: 600 9.5px var(--font-chrome); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .ap-o { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 3px; }
  .ap-o button { border: 1px solid var(--line-2); background: none; color: var(--ink-2); border-radius: var(--radius);
    cursor: pointer; font: 10.5px var(--font-chrome); padding: 2px 6px; }
  .ap-o button.active { background: var(--tint-select); border-color: var(--accent); color: var(--ink); font-weight: 600; }
  .ap input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .ap-v { flex: 0 0 36px; text-align: right; font: 10.5px var(--font-chrome); color: var(--ink-3); }

  /* ---- the reading window (materializes when the right sidebar collapses) ---- */
  .rw { position: fixed; z-index: 55; display: flex; flex-direction: column; border: 1px solid var(--line);
    border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; --opk: 1; --rwblur: 10px; }
  .rw[hidden] { display: none !important; }
  .rw[data-op="solid"]   { --opk: 1.35; --rwblur: 0px; }
  .rw[data-op="frosted"] { --opk: 1;    --rwblur: 10px; }
  .rw[data-op="glass"]   { --opk: .55;  --rwblur: 14px; }
  .rw { background: color-mix(in srgb, var(--bg-raise) calc(min(100, var(--panel-alpha) * var(--opk)) * 1%), transparent);
    backdrop-filter: blur(var(--rwblur)); -webkit-backdrop-filter: blur(var(--rwblur)); }
  .rw.dragging { pointer-events: none; }
  .rw-head { flex: none; display: flex; align-items: baseline; gap: 6px; padding: 8px 10px 7px; border-bottom: 1px solid var(--line); cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; }
  .rw.dragging .rw-head { cursor: grabbing; }
  .rw-col { font: 600 12.5px var(--font-chrome); color: var(--ink); white-space: nowrap; }
  .rw-case { flex: 1; min-width: 0; font: 11.5px var(--font-chrome); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rw-body { flex: 1; min-height: 0; overflow-y: auto; --read-size: var(--x-read, 14.5px); }
  .rw-body .whl-text[data-layout="strip"] .strip-line { white-space: normal; overflow: visible; padding: 10px 12px 12px; }
  .rw-body .whl-text[data-layout="strip"] .strip-body { white-space: normal; display: block; }
  .rw-body .whl-text[data-layout="strip"] .strip-tx2 { font-style: italic; }
  .rw-body .whl-text[data-layout="strip"] .strip-xl2 { margin-top: 8px; }
  .rw-body .whl-text .rg-case { display: none; }
  .rw-body .whl-skel { height: 64px; margin: 10px; }
  .rw-foot { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-top: 1px solid var(--line); }
  .stepbtn { flex: none; border: 1px solid var(--line-2); background: none; color: var(--ink-2); border-radius: var(--radius); width: 22px; height: 22px; cursor: pointer; font: 12px/1 var(--font-chrome); padding: 0; }
  .stepbtn:hover, .hbtn:hover { border-color: var(--accent); color: var(--ink); }
  .stepbtn[disabled] { opacity: .35; cursor: default; }
  .rw-count { font: 11px var(--font-chrome); color: var(--ink-3); min-width: 40px; text-align: center; }
  .rw-foot .spacer { flex: 1; }
  .opseg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; }
  .opseg button { border: 0; background: none; padding: 3px 8px; cursor: pointer; font: 10.5px var(--font-chrome); color: var(--ink-2); }
  .opseg button.active { background: var(--tint-select); color: var(--ink); font-weight: 600; }
  .rw-resize { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; touch-action: none; }
  .rw-resize::after { content: ''; position: absolute; right: 4px; bottom: 4px; width: 6px; height: 6px; border-right: 2px solid var(--line-2); border-bottom: 2px solid var(--line-2); }
</style>
</head>
<body>
<script>
/* anti-FOUC: scheme/mode from chrome's localStorage, appearance registers from
   this book's sessionStorage, both stamped before first paint. */
(function () {
  const q = new URLSearchParams(location.search).get('book');
  const b = ['EB01', 'E54', 'E28'].includes(q) ? q : 'EB01';
  let st = {}; try { st = JSON.parse(sessionStorage.getItem('whl-explorer-v2-' + b) || '{}') || {}; } catch {}
  const r = document.documentElement;
  const s = localStorage.getItem('whlnext-scheme') || 'archive';
  r.dataset.mode = localStorage.getItem('whlnext-mode') || 'light';
  const pal = st.pal || s;
  if (['archive', 'herbarium', 'oxford'].includes(pal)) r.dataset.scheme = pal;
  else { r.dataset.scheme = 'archive'; r.dataset.pal = pal; }
  r.dataset.pstyle = st.pstyle || 'bordered';
  r.dataset.type = st.type || 'serif';
  if (st.alpha != null) r.style.setProperty('--panel-alpha', st.alpha);
  if (st.readsize != null) r.style.setProperty('--x-read', st.readsize + 'px');
})();
</script>

<script type="module">
import { createBus } from './lib/whl-bus.js';

import { createRoll, COLS, DATA_COLS, hieroHTML } from './explore-common.js';

const $ = s => document.querySelector(s);

/* ---------- per-book configuration ---------- */
const BOOKS = {
  EB01: {
    title: 'Papyrus Ebers', kind: 'roll', start: 'col-0045',
    entriesTitle: c => 'Cases · col. ' + (+c.slice(4)),
    pageLabel: c => 'Column ' + (+c.slice(4)),
    rows: regs => regs.map((r, i) => r.case_label ? { i, r1: r.case_label } : null).filter(Boolean),
    comm: {
      'col-0044': [['Eb 217–224', 'Concordance: Grundriss der Medizin IV/1 ad loc. — = H 48–49, 79–82; the Hearst parallels run in block, variants orthographic.'], ['Eb 214', 'vgl. pChester Beatty VIII vso. 5,1–3, which transmits the same text in a later hand.']],
      'col-0045': [['Eb 226–236', 'Concordance: Grundriss der Medizin IV/1 ad loc. for the cases of this column.'], ['Eb 227', 'vgl. Bln 58 — the Berlin papyrus transmits the same remedy with the drug list reordered.']],
      'col-0046': [['Eb 242', 'Rubricated title case; the ḫꜣs.yt-fruit group it opens runs through Eb 245.'], ['Eb 243–245', '= H 71–73: the Hearst sequence keeps the order of the common Vorlage.']],
      'col-0048': [['Eb 251d', 'Conclusion of a case begun in col. 47; only the final clause stands in this column.'], ['Eb 252–262', 'Date juice (bnj.w) is the standing vehicle through this run of prescriptions.']],
    },
    qa: ['Which drugs recur in Eb 226–236?', 'Coriander (šꜣ.w), cumin (tpnn) and gum (qmy.t) each appear in more than one prescription of this column; wheat flour (sw.t) is the usual base.'],
  },
  E54: {
    title: 'Ben Cao Gang Mu', kind: 'single', page: 'center',
    img: 'assets/pages/E54-page.jpg', w: 978, h: 1600,
    layers: { center: ['source', 'glyphs', 'associations', 'entities'] },   // whl-store defaults to words for non-EB01
    entriesTitle: () => 'Entries', pageLabel: () => 'fol. 19',
    rows: regs => regs.map((r, i) => (r.text || '').trim() ?
      { i, r1: first(r.text, 15), r2: first(r.translation, 44) } : null).filter(Boolean),
    comm: { center: [['E17 · 中药大辞典', 'The dictionary resolves its Bencao gangmu citations against this edition; the 1888 Hongbaozhai woodblock is its reference printing.']] },
    qa: ['How are pill sizes reckoned?', 'By a ladder of seeds: three sesame grains (胡麻) equal one hemp seed (大麻子), three hemp seeds the small bean (赤小豆), two small beans the soy bean (大豆), two soy beans the wutong seed (梧子).'],
  },
  E28: {
    title: 'The English Physitian', kind: 'single', page: 'center',
    img: 'assets/pages/E28-page.jpg', w: 1045, h: 1600,
    // The opening. The extracted leaf is a recto (printed 18; number and gilt fore-edge at the
    // right), so the facing leaf sits to its LEFT: page-0043, a verso (printed 20, number and
    // fore-edge at the left), image only — no layer data exists for it, and none is expected.
    facing: { key: 'page-0043', url: 'assets/pages/E28-page-0043.jpg', w: 1081, h: 1600, side: 'left' },
    entriesTitle: () => 'Entries', pageLabel: () => 'p. 18',
    rows: regs => regs.map((r, i) => {
      if (r.type !== 'title') return null;
      const id = (/\[([^\]]+)\]/.exec(r.translation || '') || [])[1] || '';
      return { i, r1: r.text, r2: id, sub: !id };
    }).filter(Boolean),
    comm: { center: [['This copy', 'An early annotating hand runs in the margins of this copy; the printed side-notes (Feavers, Head, Eyes …) index the virtues paragraph beside them.']] },
    qa: ['What are the blites good for?', 'Cooling, drying and binding — Culpeper has them restrain fluxes of blood in man or woman, the red kind especially.'],
  },
};
const BID = (id => BOOKS[id] ? id : 'EB01')(new URLSearchParams(location.search).get('book'));
const B = BOOKS[BID];
const FACING = B.facing ? B.facing.key : null;
const bus = createBus();

/* ---------- persisted UI state (namespaced per book) ---------- */
const SKEY = 'whl-explorer-v2-' + BID;
let S = {
  left: 0, right: 0, w: 340, lw: 250, rsplit: 58, hiero: 0, secs: {},
  win: { x: -1, y: -1, w: 480, h: 420, op: 'frosted' },
  pal: '', pstyle: 'bordered', type: 'serif', alpha: 88, readsize: 14.5,
  pairAuto: 1, pairF: 0.5, opening: 0,
};
try { const s = JSON.parse(sessionStorage.getItem(SKEY) || 'null');
  if (s && typeof s === 'object') S = { ...S, ...s, win: { ...S.win, ...(s.win || {}) }, secs: { ...(s.secs || {}) } };
} catch {}
const save = () => { try { sessionStorage.setItem(SKEY, JSON.stringify(S)); } catch {} };

const chrome = mountChrome({
  title: B.title, back: 'index.html', bus,
  book: { label: BID, title: B.title, thumb: `assets/thumbs/${BID}.jpg` },
  adv: false, mockSwitch: 'mode-only',
  note: '?book= switches the book; [ ] toggle rails; collapse right → window; panel edges and the miniature drag; Esc clears.',
});
chrome.el.classList.add('psurf');
const bsw = document.createElement('nav');
bsw.className = 'bookswitch'; bsw.setAttribute('aria-label', 'Book');
bsw.innerHTML = Object.keys(BOOKS).map(id =>
  `<a href="?book=${id}"${id === BID ? ' class="cur" aria-current="page"' : ''}>${id}</a>`).join('');
const chip = chrome.el.querySelector('.bookpick');
if (chip) chip.after(bsw); else chrome.el.appendChild(bsw);
const apBtn = document.createElement('button');
apBtn.type = 'button'; apBtn.className = 'apbtn'; apBtn.id = 'apBtn'; apBtn.textContent = 'Appearance';
apBtn.setAttribute('aria-expanded', 'false');
chrome.el.appendChild(apBtn);

/* ---------- viewer / store ---------- */
let viewer, store, VPAGES = [];
function singlePages() {
  const own = { key: B.page, url: B.img, w: B.w, h: B.h };
  if (!S.opening || !B.facing) return [own];
  const f = { key: FACING, url: B.facing.url, w: B.facing.w, h: B.facing.h };
  return B.facing.side === 'left' ? [f, own] : [own, f];   // LTR world: verso left, recto right
}
function mountSingleViewer() {
  VPAGES = singlePages();
  return createViewer({
    el: $('#osd'), bus, store, book: BID,
    profile: (S.opening && B.facing)
      ? { layout: 'scroll-h', gap: .014, zoomOnSelect: false, viewportEvents: true }   // LTR: verso left, recto right
      : { layout: 'single', zoomOnSelect: false, viewportEvents: true },
    pages: VPAGES, start: B.page,
  });
}
if (B.kind === 'roll') {
  ({ viewer, store } = createRoll({ el: $('#osd'), bus, start: B.start,
    viewerOpts: { profile: { zoomOnSelect: false, viewportEvents: true } } }));
  VPAGES = COLS;
} else {
  store = createStore({ base: 'lib/data', book: BID, bus, pages: [B.page], layers: B.layers, latency: '3g' });
  createLinker({ bus, store });
  viewer = mountSingleViewer();
  store.load(B.page);
}
const DATA_PAGES = B.kind === 'roll' ? DATA_COLS : [B.page];
const START = B.kind === 'roll' ? B.start : B.page;

/* ---------- shared reading state (window ⇄ Text pane) ---------- */
let viewCol = START, curCol = START, curRegion = 1, selActive = false, lastH = null;
let txPane = null, winPane = null, txLayout = null;
const regionsOf = c => (store.get(c) && store.get(c).source && store.get(c).source.regions) || [];
const hasData = c => DATA_PAGES.includes(c);
const entryLabel = i => {
  const regs = regionsOf(curCol), r = regs[i];
  if (!r) return hasData(curCol) ? '…' : '—';
  if (B.kind === 'roll') return r.case_label || (r.type === 'header' ? 'column header' : '');
  const row = B.rows(regs).filter(x => x.i <= i).pop();
  return row ? row.r1 : (r.type || '');
};

bus.on('highlight', h => { lastH = h; viewer.applyHighlight(h);
  if (txPane) txPane.applyHighlight(h); if (winPane) winPane.applyHighlight(h); });

/* ---------- hieroglyph lines (toggle-gated; control exists only where hl data does) ---------- */
function injectHiero(root, col) {
  if (!root) return;
  root.querySelectorAll('.hl-block').forEach(n => n.remove());
  if (!S.hiero) return;
  const regs = regionsOf(col);
  root.querySelectorAll('.rg-el').forEach(el => {
    const html = hieroHTML(regs[+el.dataset.r]); if (!html) return;
    const tx = el.querySelector('.strip-tx2') || el.querySelector('.tx') || el.querySelector('.strip-body');
    if (!tx) return;
    const d = document.createElement('div'); d.className = 'hl-block'; d.innerHTML = html;
    tx.after(d);
  });
}
let hq = 0;   // debounced via macrotask (rAF stalls in occluded panes)
const reHiero = () => { clearTimeout(hq); hq = setTimeout(() => {
  injectHiero($('#txPane'), curCol); injectHiero($('#rwText'), curCol); scheduleBalance(); }, 32); };
const hbtn = $('#hieroBtn');
let hieroOK = false;   // gate by data presence: any region with hl lines
function checkHiero() {
  if (hieroOK) return;
  if (DATA_PAGES.some(k => regionsOf(k).some(r => Array.isArray(r.hl) && r.hl.length)))
    { hieroOK = true; hbtn.hidden = false; }
}
function syncHiero() { hbtn.classList.toggle('on', !!S.hiero);
  hbtn.setAttribute('aria-pressed', S.hiero ? 'true' : 'false'); reHiero(); }
hbtn.addEventListener('click', () => { S.hiero = S.hiero ? 0 : 1; save(); syncHiero(); });

/* ---------- left rail: columns (roll only) + cases/entries, filtered ---------- */
const caseNo = l => { const m = /^Eb (\d+[a-z]?)/.exec(l || ''); return m ? m[1] : null; };
function colRange(c) {
  const ns = regionsOf(c).map(r => caseNo(r.case_label)).filter(Boolean);
  return ns.length ? 'Eb ' + ns[0] + '–' + ns[ns.length - 1] : (hasData(c) ? '…' : '—');
}
function renderCols() {
  if (B.kind !== 'roll') return;
  $('#colList').innerHTML = COLS.map(({ key }) =>
    `<div class="row${hasData(key) ? '' : ' dim'}${key === viewCol ? ' cur' : ''}" data-col="${key}">` +
    `<span class="r1">Column ${+key.slice(4)}</span><span class="r2">${colRange(key)}</span></div>`).join('');
  $('#lStrip').innerHTML = COLS.map(({ key }) =>
    `<button type="button" class="stripbtn${key === viewCol ? ' cur' : ''}${hasData(key) ? '' : ' dim'}" data-col="${key}">${+key.slice(4)}</button>`).join('');
  applyFind();
}
function renderCases() {
  const rows = B.rows(regionsOf(viewCol));
  const curI = B.kind === 'roll' ? curRegion
    : (rows.filter(x => x.i <= curRegion).pop() || { i: -1 }).i;
  $('#caseList').innerHTML = rows.length ? rows.map(r =>
    `<div class="row${r.sub ? ' sub' : ''}${viewCol === curCol && r.i === curI ? ' cur' : ''}" data-region="${r.i}">` +
    `<span class="r1">${esc(r.r1)}</span>${r.r2 ? `<span class="r2">${esc(r.r2)}</span>` : ''}</div>`).join('')
    : `<div class="rail-empty">${hasData(viewCol) ? '…' : '—'}</div>`;
  $('#casesTitle').textContent = B.entriesTitle(viewCol);
  applyFind();
}
let findQ = '';
function applyFind() {
  document.querySelectorAll('#colList .row, #caseList .row').forEach(r =>
    { r.hidden = !!findQ && !r.textContent.toLowerCase().includes(findQ); });
}
const lFind = $('#lFind');
lFind.addEventListener('input', () => { findQ = lFind.value.trim().toLowerCase(); applyFind(); });
$('#lrail').addEventListener('click', e => {
  const c = e.target.closest('[data-col]'); if (c) { viewer.goto(c.dataset.col); return; }
  const r = e.target.closest('[data-region]'); if (r) viewer.select(viewCol, +r.dataset.region);
});

/* ---------- position miniature: world map + live viewport rect ---------- */
const mini = $('#mini'), miniIn = $('#miniIn'), miniVp = $('#miniVp');
let MG = null;   // {minX, k}
const osdInst = () => { try {
  return (window.OpenSeadragon && window.OpenSeadragon.getViewer) ? window.OpenSeadragon.getViewer('osd') : null;
} catch { return null; } };
function buildMini() {
  const rs = VPAGES.map(p => viewer.worldRect(p.key));
  if (!rs.length || rs.some(r => !r)) { MG = null; return; }
  const minX = Math.min(...rs.map(r => r.x)), maxX = Math.max(...rs.map(r => r.x + r.w));
  const W = (maxX - minX) || 1;
  const bw = mini.clientWidth, bh = mini.clientHeight;
  if (bw <= 0 || bh <= 0) return;
  const k = Math.min(bw / W, bh);
  MG = { minX, k };
  miniIn.style.width = (W * k) + 'px'; miniIn.style.height = k + 'px';
  miniIn.querySelectorAll('.mini-cell').forEach(n => n.remove());
  VPAGES.forEach((p, i) => {
    const r = rs[i], c = p.clip || {};
    const cl = c.left || 0, ct = c.top || 0, cb = c.bottom || 0;
    const ch = 1 - ct - cb, a = (p.w > 0 && p.h > 0) ? p.w / p.h : .7;
    const Wi = a / ch, Hi = 1 / ch;                    // full image in world units
    const cell = document.createElement('div');
    cell.className = 'mini-cell';
    cell.style.cssText = `left:${(r.x - minX) * k}px;top:0;width:${r.w * k}px;height:${k}px`;
    const img = document.createElement('img');
    img.src = p.url; img.alt = ''; img.decoding = 'async';
    img.style.cssText = `left:${(-cl * Wi) * k}px;top:${(-ct * Hi) * k}px;width:${Wi * k}px;height:${Hi * k}px`;
    cell.appendChild(img);
    miniIn.insertBefore(cell, miniVp);
  });
  updateVp(viewer.viewportInfo());
}
function updateVp(v) {
  if (!MG || !v) return;
  miniVp.style.left = ((v.x - MG.minX) * MG.k) + 'px';
  miniVp.style.top = (v.y * MG.k) + 'px';
  miniVp.style.width = Math.max(3, v.w * MG.k) + 'px';
  miniVp.style.height = Math.max(3, v.h * MG.k) + 'px';
}
bus.on('viewport', updateVp);
function panWorld(wx, wy) {
  const v = osdInst();
  if (v && v.viewport) {
    try { v.viewport.panTo(new window.OpenSeadragon.Point(wx, wy), true); v.viewport.applyConstraints(true); return; } catch {}
  }
  let best = null, bd = Infinity;                       // no-OSD strip: page granularity
  for (const p of VPAGES) { const r = viewer.worldRect(p.key); if (!r) continue;
    const d = wx < r.x ? r.x - wx : (wx > r.x + r.w ? wx - (r.x + r.w) : 0);
    if (d < bd) { bd = d; best = p.key; } }
  if (best) viewer.goto(best);
}
let mDrag = null;
function miniPan(e) {
  if (!MG) return;
  const r = miniIn.getBoundingClientRect();
  panWorld(MG.minX + (e.clientX - r.left) / MG.k, (e.clientY - r.top) / MG.k);
  updateVp(viewer.viewportInfo());
}
mini.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !MG) return;
  mDrag = e.pointerId; try { mini.setPointerCapture(e.pointerId); } catch {}
  miniPan(e); e.preventDefault();
});
mini.addEventListener('pointermove', e => { if (mDrag === e.pointerId) miniPan(e); });
const endMini = () => { mDrag = null; };
mini.addEventListener('pointerup', endMini); mini.addEventListener('pointercancel', endMini);

/* opening / single (books with a facing page only) */
function fitOpening(immediate) {           // frame both leaves, not just the start page
  const v = osdInst(); if (!v || !v.viewport || VPAGES.length < 2) return;
  const rs = VPAGES.map(p => viewer.worldRect(p.key)).filter(Boolean);
  if (rs.length < 2) return;
  const minX = Math.min(...rs.map(r => r.x)), maxX = Math.max(...rs.map(r => r.x + r.w));
  try { v.viewport.fitBounds(new window.OpenSeadragon.Rect(minX - .02, -.02, (maxX - minX) + .04, 1.04), !!immediate); } catch {}
}
function syncOpen() {
  document.querySelectorAll('#openSeg button').forEach(b =>
    b.classList.toggle('active', +b.dataset.open === (S.opening ? 1 : 0)));
}
if (B.facing) {
  $('#openSeg').hidden = false; syncOpen();
  $('#openSeg').addEventListener('click', e => {
    const b = e.target.closest('button[data-open]'); if (!b) return;
    const v = +b.dataset.open; if (v === (S.opening ? 1 : 0)) return;
    S.opening = v; save(); syncOpen();
    try { viewer.destroy(); } catch {}
    $('#osd').innerHTML = '';
    viewer = mountSingleViewer();
    if (lastH) viewer.applyHighlight(lastH);
    setTimeout(() => { buildMini(); fitOpening(); }, 60);
    setTimeout(buildMini, 400);
  });
}

/* ---------- right sidebar: commentary + entities + ask ---------- */
function renderComm() {
  const es = B.comm[curCol] || [];
  $('#commList').innerHTML = es.length ? es.map(([h, t]) =>
    `<div class="com"><div class="com-h">${h}</div><div class="com-t">${t}</div></div>`).join('') :
    '<div class="rail-empty">—</div>';
}
function renderEnts() {
  const pd = store.get(curCol), es = ((pd && pd.entities) || []).filter(e => e.type !== 'citation');
  $('#entList').innerHTML = es.length ? es.map(e =>
    `<div class="ent-row ent-${esc(e.type)}"><div class="ent-lab">${esc(e.label)}</div><div class="ent-sum">${esc(e.summary || '')}</div></div>`).join('') :
    `<div class="rail-empty">${hasData(curCol) ? '…' : '—'}</div>`;
}
$('#qaBox').innerHTML = `<div class="q">${esc(B.qa[0])}</div><div class="a">${esc(B.qa[1])}</div>`;
const ask = $('#askIn');
ask.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return; e.preventDefault();
  ask.disabled = true; setTimeout(() => { ask.disabled = false; }, 900);
});

/* ---------- panes ---------- */
function mountTx() {
  if (txPane) { txPane.destroy(); txPane = null; }
  const el = $('#txPane'); el.innerHTML = '';
  const no = !hasData(curCol);
  $('#txEmpty').hidden = !no; el.hidden = no;
  if (no || S.right) return;
  txLayout = S.w >= 420 ? 'pair' : 'stacked';
  txPane = createTextPane({ el, bus, store, book: BID, page: curCol, layout: txLayout });
  if (lastH) txPane.applyHighlight(lastH);
  reHiero(); scheduleBalance();
}
function mountWin() {
  if (winPane) { winPane.destroy(); winPane = null; }
  const el = $('#rwText'); el.innerHTML = '';
  const no = !hasData(curCol);
  $('#rwEmpty').hidden = !no; el.hidden = no;
  if (no || !S.right) return;
  winPane = createTextPane({ el, bus, store, book: BID, page: curCol, layout: 'strip', stripShow: 'both' });
  winPane.setRegion(curRegion);
  if (lastH) winPane.applyHighlight(lastH);
  reHiero();
}
function renderWinState() {
  const regs = regionsOf(curCol);
  $('#rwCol').textContent = B.pageLabel(curCol);
  const label = entryLabel(curRegion);
  $('#rwCase').textContent = label ? '· ' + label : '';
  $('#rwCount').textContent = regs.length ? (curRegion + 1) + ' / ' + regs.length : '';
  $('#rwPrev').disabled = !regs.length || curRegion <= 0;
  $('#rwNext').disabled = !regs.length || curRegion >= regs.length - 1;
}
function retarget(col, region) {
  const colChanged = col !== curCol;
  curCol = col; curRegion = Math.max(0, +region || 0);
  if (colChanged) { if (S.right) mountWin(); else mountTx(); renderComm(); renderEnts(); }
  else if (winPane) winPane.setRegion(curRegion);
  renderCases(); renderWinState();
}
function scrollTx(region) {   // smooth, with verify-and-jump (scrollIntoView crawls when throttled)
  if (!txPane) return;
  txPane.scrollTo(region);
  setTimeout(() => {
    const w = $('#txWrap'), n = w.querySelector(`.rg-el[data-r="${region}"]`);
    if (!n || !txPane) return;
    const a = w.getBoundingClientRect(), b = n.getBoundingClientRect();
    if (b.bottom < a.top + 8 || b.top > a.bottom - 8) txPane.scrollTo(region, { instant: true });
  }, 480);
}
bus.on('select', p => {
  if (!p || p.page == null || p.region == null || p.page === FACING) return;
  selActive = true; retarget(p.page, +p.region); reHiero();
  if (!S.right) setTimeout(() => scrollTx(curRegion), 0);
});
bus.on('select:clear', () => { selActive = false; });
bus.on('view', p => {
  if (!p || !p.page || p.page === FACING) return;   // the recto carries no layers: it never retargets the text
  if (p.page !== viewCol) { viewCol = p.page; renderCols(); renderCases(); }
  if (p.page !== curCol && !selActive) retarget(p.page, regionsOf(p.page).length > 1 ? 1 : 0);
});
bus.on('layer', p => {
  if (!p || p.status !== 'ready') return;
  if (p.name === 'source') { checkHiero(); renderCols(); renderCases(); renderWinState(); }
  if (p.name === 'entities' && p.page === curCol) renderEnts();
  reHiero();   // text panes re-render on each layer arrival, wiping injected lines
});
function step(d) {
  const regs = regionsOf(curCol); if (!regs.length) return;
  const n = clamp(0, regs.length - 1, curRegion + d);
  if (n !== curRegion) viewer.select(curCol, n);   // highlight follows; no viewport jump
}
$('#rwPrev').onclick = () => step(-1); $('#rwNext').onclick = () => step(1);

/* ---------- tx / xl auto-balance (pair layout) ----------
   Fixed-point iteration on the wrapped-text area model: at a given column width
   the rendered area h·w is near-invariant, so the width share that equalises the
   two heights is A_tx/(A_tx+A_xl). Taking the MEDIAN share across the page's
   regions minimises the typical (not per-region) height difference; re-measuring
   after each apply converges in 2–3 passes. */
function applyPair(f) {
  const el = $('#txPane');
  el.style.setProperty('--pair-tx', f.toFixed(3) + 'fr');
  el.style.setProperty('--pair-xl', (1 - f).toFixed(3) + 'fr');
}
function measurePair() {
  const rows = [];
  $('#txPane').querySelectorAll('.rg-el').forEach(el => {
    const tx = el.querySelector('.tx'), xl = el.querySelector('.xl');
    if (!tx || !xl) return;
    const hl = el.querySelector('.hl-block');
    const txH = tx.offsetHeight + (hl ? hl.offsetHeight + 8 : 0);
    const xlH = xl.offsetHeight - 12, txW = tx.offsetWidth, xlW = xl.offsetWidth - 18;  // .xl padding 6/9
    if (txH > 0 && xlH > 0 && txW > 0 && xlW > 0) rows.push({ txH, xlH, txW, xlW });
  });
  return rows;
}
const medianOf = a => a.slice().sort((x, y) => x - y)[a.length >> 1];
function probePair(f) {                                     // apply, force layout, measure
  const el = $('#txPane');
  applyPair(f); void el.offsetHeight;
  const rows = measurePair(); if (!rows.length) return null;
  return {
    d: medianOf(rows.map(r => r.txH - r.xlH)),              // median signed height difference
    a: medianOf(rows.map(r => {                             // area-model share that would equalise
      const atx = r.txH * r.txW, axl = r.xlH * r.xlW;
      return (atx + axl) > 0 ? atx / (atx + axl) : .5;
    })),
  };
}
function runBalance() {
  const el = $('#txPane');
  if (!txPane || txLayout !== 'pair' || el.hidden) return;
  if (!S.pairAuto) { applyPair(S.pairF); return; }
  const seed = probePair(clamp(.22, .78, S.pairF || .5)); if (!seed) return;
  // d(f) decreases monotonically in f (a wider transcription column is a shorter one),
  // so bisect on the measured median difference, seeded by the area model.
  let lo = .22, hi = .78, f = clamp(lo, hi, seed.a), best = { f, d: Infinity };
  for (let n = 0; n < 7; n++) {
    const p = probePair(f); if (!p) break;
    if (Math.abs(p.d) < Math.abs(best.d)) best = { f, d: p.d };
    if (p.d === 0 || hi - lo < .006) break;
    if (p.d > 0) lo = f; else hi = f;
    f = (lo + hi) / 2;
  }
  S.pairF = Math.round(best.f * 1000) / 1000;
  applyPair(S.pairF); save(); syncApRatio();
}
let bq = 0;
const scheduleBalance = () => { clearTimeout(bq); bq = setTimeout(runBalance, 80); };

/* ---------- window geometry: drag / resize / translucency ---------- */
const win = $('#rw'), head = $('#rwHead'), rz = $('#rwResize');
const topMin = () => chrome.el.getBoundingClientRect().bottom + 8;
function applyW() {
  const W = S.win, vw = innerWidth, vh = innerHeight, ty = topMin();
  if (vw < 120 || vh < 120) return;   // hidden/zero viewport: keep geometry, re-clamp on resize
  W.w = clamp(260, vw - 16, W.w); W.h = clamp(160, vh - ty - 8, W.h);
  if (W.x < 0 && W.y < 0) { W.x = vw - W.w - 64; W.y = ty + 4; }
  W.x = clamp(8, vw - W.w - 8, W.x); W.y = clamp(ty, vh - 44, W.y);
  win.style.left = W.x + 'px'; win.style.top = W.y + 'px';
  win.style.width = W.w + 'px'; win.style.height = W.h + 'px';
  win.dataset.op = W.op;
  document.querySelectorAll('#opSeg button').forEach(b => b.classList.toggle('active', b.dataset.op === W.op));
}
let drag = null, rs = null;
head.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  drag = { dx: e.clientX - S.win.x, dy: e.clientY - S.win.y, id: e.pointerId };
  try { head.setPointerCapture(e.pointerId); } catch {}
  win.classList.add('dragging');
});
head.addEventListener('pointermove', e => {
  if (drag && e.pointerId === drag.id) { S.win.x = e.clientX - drag.dx; S.win.y = e.clientY - drag.dy; applyW(); }
});
const endDrag = () => { if (drag || rs) { drag = rs = null; win.classList.remove('dragging'); save(); } };
head.addEventListener('pointerup', endDrag); head.addEventListener('pointercancel', endDrag);
rz.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  rs = { dw: S.win.w - e.clientX, dh: S.win.h - e.clientY, id: e.pointerId };
  try { rz.setPointerCapture(e.pointerId); } catch {}
  win.classList.add('dragging'); e.preventDefault();
});
rz.addEventListener('pointermove', e => {
  if (rs && e.pointerId === rs.id) { S.win.w = e.clientX + rs.dw; S.win.h = e.clientY + rs.dh; applyW(); }
});
rz.addEventListener('pointerup', endDrag); rz.addEventListener('pointercancel', endDrag);
$('#opSeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-op]');
  if (!b || b.dataset.op === S.win.op) return;
  S.win.op = b.dataset.op; applyW(); save();
});

/* ---------- coupling: sidebar collapse ⇄ window FLIP ---------- */
const rside = $('#rside'), lrail = $('#lrail'), MS = 240;
const flipT = (a, b) =>   // transform carrying rect b onto rect a (origin 0 0)
  `translate(${b.left - a.left}px,${b.top - a.top}px) scale(${b.width / a.width},${b.height / a.height})`;
function flipFrom(rect) {                  // window flies out of the collapsed rail
  win.hidden = false; applyW();
  win.style.transformOrigin = '0 0'; win.style.transition = 'none';
  win.style.transform = flipT(win.getBoundingClientRect(), rect); win.style.opacity = '.35';
  let on = false; const go = () => {
    if (on) return; on = true;
    win.style.transition = `transform ${MS}ms ease,opacity ${MS}ms ease`;
    win.style.transform = ''; win.style.opacity = ''; setTimeout(() => { win.style.transition = ''; }, MS + 40);
  };
  requestAnimationFrame(go); setTimeout(go, 30);
}
function flipInto(rect, done) {            // window is sucked into the Text section
  win.style.transformOrigin = '0 0';
  win.style.transition = `transform ${MS}ms ease,opacity ${MS}ms ease`;
  win.style.transform = flipT(win.getBoundingClientRect(), rect); win.style.opacity = '.15';
  setTimeout(() => {
    win.hidden = true; win.style.transition = win.style.transform = win.style.opacity = '';
    if (done) done();
  }, MS + 20);
}
function syncRight() { rside.style.width = S.right ? '' : S.w + 'px'; $('#rToggle').textContent = S.right ? '‹' : '›'; }
function toggleRight() {
  if (!S.right) {                          // collapse → the window materializes
    S.right = 1; save();
    rside.classList.add('collapsed'); syncRight();
    if (txPane) { txPane.destroy(); txPane = null; }
    mountWin(); renderWinState();
    flipFrom(rside.getBoundingClientRect());
  } else {                                 // expand → the sidebar takes the window back
    S.right = 0; save();
    rside.classList.remove('collapsed'); syncRight();
    mountTx();
    const t = $('#txWrap').getBoundingClientRect();
    flipInto(t.height > 40 ? t : rside.getBoundingClientRect(), () => {
      if (winPane) { winPane.destroy(); winPane = null; }
      $('#rwText').innerHTML = '';
    });
    setTimeout(() => { if (txPane) txPane.scrollTo(curRegion, { instant: true }); }, 0);
  }
}
function syncLeft() {
  lrail.classList.toggle('collapsed', !!S.left);
  if (!S.left) lrail.style.width = S.lw + 'px';
  $('#lToggle').textContent = S.left ? '›' : '‹';
  if (!S.left) setTimeout(buildMini, 0);
}
const toggleLeft = () => { S.left = S.left ? 0 : 1; save(); syncLeft(); };
$('#lToggle').onclick = toggleLeft; $('#rToggle').onclick = toggleRight;

/* left sidebar width: drag its right edge 180–420 */
let lg = null; const lsGrip = $('#lsGrip');
lsGrip.addEventListener('pointerdown', e => {
  if (e.button !== 0 || S.left) return;
  lg = { x: e.clientX, w: S.lw, id: e.pointerId };
  try { lsGrip.setPointerCapture(e.pointerId); } catch {}
  e.preventDefault();
});
lsGrip.addEventListener('pointermove', e => {
  if (!lg || e.pointerId !== lg.id) return;
  S.lw = clamp(180, 420, lg.w + (e.clientX - lg.x));
  lrail.style.width = S.lw + 'px'; buildMini();
});
const endLg = () => { if (lg) { lg = null; save(); buildMini(); } };
lsGrip.addEventListener('pointerup', endLg); lsGrip.addEventListener('pointercancel', endLg);

/* right sidebar width: drag its left edge 280–560, live layout switch */
let rg = null; const grip = $('#rsGrip');
function syncTxLayout() {
  const l = S.w >= 420 ? 'pair' : 'stacked';
  if (txPane && l !== txLayout) { txLayout = l; txPane.setLayout(l); reHiero(); }
  scheduleBalance();
}
grip.addEventListener('pointerdown', e => {
  if (e.button !== 0 || S.right) return;
  rg = { x: e.clientX, w: S.w, id: e.pointerId };
  try { grip.setPointerCapture(e.pointerId); } catch {}
  e.preventDefault();
});
grip.addEventListener('pointermove', e => {
  if (!rg || e.pointerId !== rg.id) return;
  S.w = clamp(280, 560, rg.w + (rg.x - e.clientX));
  rside.style.width = S.w + 'px'; syncTxLayout();   // layout switches live while dragging
});
const endRg = () => { if (rg) { rg = null; save(); } };
grip.addEventListener('pointerup', endRg); grip.addEventListener('pointercancel', endRg);

/* right sidebar: the division point between the two panels */
const rsSplit = $('#rsSplit');
const applySplit = () => rside.style.setProperty('--rsplit', S.rsplit + '%');
let sp = null;
rsSplit.addEventListener('pointerdown', e => {
  if (e.button !== 0 || S.right) return;
  sp = e.pointerId; try { rsSplit.setPointerCapture(e.pointerId); } catch {}
  e.preventDefault();
});
rsSplit.addEventListener('pointermove', e => {
  if (sp !== e.pointerId) return;
  const b = rside.getBoundingClientRect(); if (b.height < 80) return;
  S.rsplit = Math.round(clamp(18, 86, (e.clientY - b.top) / b.height * 100));
  applySplit();
});
const endSp = () => { if (sp != null) { sp = null; save(); } };
rsSplit.addEventListener('pointerup', endSp); rsSplit.addEventListener('pointercancel', endSp);

/* collapsible sections: header row toggles; state per-section */
document.querySelectorAll('.sec-h').forEach(h => h.addEventListener('click', e => {
  if (e.target.closest('.hbtn')) return;
  const sec = h.closest('.sec');
  S.secs[sec.dataset.sec] = sec.classList.toggle('closed') ? 1 : 0; save();
  scheduleBalance();
}));
const applySecs = () => document.querySelectorAll('.sec').forEach(s =>
  s.classList.toggle('closed', !!S.secs[s.dataset.sec]));

/* ---------- appearance ---------- */
const PALS = [['archive', 'Archive'], ['herbarium', 'Herbarium'], ['oxford', 'Oxford'],
  ['olive', 'Olive'], ['ochre', 'Ochre'], ['umber', 'Umber'], ['slate', 'Slate']];
const TOKEN_PALS = ['archive', 'herbarium', 'oxford'];
const STYLES = [['bordered', 'Bordered'], ['shaded', 'Shaded'], ['flat', 'Flat']];
const TYPES = [['serif', 'Serif'], ['garamond', 'Garamond'], ['sans', 'Sans']];
const apEl = $('#ap'), root = document.documentElement;
const segHTML = (list, cur) => list.map(([v, l]) =>
  `<button type="button" data-v="${v}"${v === cur ? ' class="active"' : ''}>${l}</button>`).join('');
function applyAppearance() {
  if (!S.pal) S.pal = localStorage.getItem('whlnext-scheme') || 'archive';
  if (TOKEN_PALS.includes(S.pal)) { root.dataset.scheme = S.pal; root.removeAttribute('data-pal'); }
  else { root.dataset.scheme = 'archive'; root.dataset.pal = S.pal; }
  root.dataset.pstyle = S.pstyle; root.dataset.type = S.type;
  root.style.setProperty('--panel-alpha', S.alpha);
  root.style.setProperty('--x-read', S.readsize + 'px');
  $('#apPal').innerHTML = segHTML(PALS, S.pal);
  $('#apStyle').innerHTML = segHTML(STYLES, S.pstyle);
  $('#apType').innerHTML = segHTML(TYPES, S.type);
  $('#apAlpha').value = S.alpha; $('#apAlphaV').textContent = S.alpha + '%';
  $('#apSize').value = S.readsize; $('#apSizeV').textContent = S.readsize + 'px';
  syncApRatio();
}
function syncApRatio() {
  $('#apAuto').classList.toggle('active', !!S.pairAuto);
  $('#apRatio').value = Math.round(S.pairF * 100);
  $('#apRatioV').textContent = Math.round(S.pairF * 100) + '%';
}
$('#apPal').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (!b) return;
  S.pal = b.dataset.v; save(); applyAppearance(); });
$('#apStyle').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (!b) return;
  S.pstyle = b.dataset.v; save(); applyAppearance(); });
$('#apType').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (!b) return;
  S.type = b.dataset.v; save(); applyAppearance(); scheduleBalance(); });
$('#apAlpha').addEventListener('input', e => { S.alpha = +e.target.value;
  root.style.setProperty('--panel-alpha', S.alpha); $('#apAlphaV').textContent = S.alpha + '%'; save(); });
$('#apSize').addEventListener('input', e => { S.readsize = +e.target.value;
  root.style.setProperty('--x-read', S.readsize + 'px'); $('#apSizeV').textContent = S.readsize + 'px';
  save(); scheduleBalance(); });
$('#apAuto').addEventListener('click', () => { S.pairAuto = 1; save(); runBalance(); syncApRatio(); });
$('#apRatio').addEventListener('input', e => { S.pairAuto = 0; S.pairF = +e.target.value / 100;
  applyPair(S.pairF); syncApRatio(); save(); });
function apOpen(on) {
  apEl.hidden = !on; apBtn.classList.toggle('on', on); apBtn.setAttribute('aria-expanded', on ? 'true' : 'false');
  if (on) apEl.style.top = (chrome.el.getBoundingClientRect().bottom + 6) + 'px';
}
apBtn.addEventListener('click', () => apOpen(apEl.hidden));
document.addEventListener('pointerdown', e => {
  if (apEl.hidden || apEl.contains(e.target) || e.target === apBtn) return;
  apOpen(false);
}, true);
bus.on('mode', () => scheduleBalance());

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'Escape') {
    if (lFind.value) { lFind.value = ''; findQ = ''; applyFind(); }
    apOpen(false); bus.emit('select:clear', {}); lFind.blur(); return;
  }
  if (/input|select|textarea/i.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') { if (B.kind === 'roll') viewer.next(); else step(-1); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { if (B.kind === 'roll') viewer.prev(); else step(1); e.preventDefault(); }
  else if (e.key === '[') { toggleLeft(); e.preventDefault(); }
  else if (e.key === ']') { toggleRight(); e.preventDefault(); }
});

/* ---------- boot ---------- */
if (B.kind !== 'roll') $('#colSec').style.display = 'none';
function layoutTop() { const t = chrome.el.getBoundingClientRect().bottom;
  lrail.style.top = rside.style.top = t + 'px'; }
let rq = 0;
window.addEventListener('resize', () => {
  layoutTop(); if (!win.hidden) applyW();
  clearTimeout(rq); rq = setTimeout(() => { buildMini(); scheduleBalance(); }, 120);
});
applyAppearance(); applySecs(); syncLeft(); syncHiero(); applySplit();
rside.classList.toggle('collapsed', !!S.right); syncRight(); layoutTop();
viewCol = curCol = viewer.current() || START;
renderCols(); renderCases(); renderComm(); renderEnts();
if (S.right) { mountWin(); win.hidden = false; applyW(); } else mountTx();
renderWinState();
[80, 400, 1200].forEach(t => setTimeout(buildMini, t));   // viewportEvents does not fire on init/resize
if (S.opening && B.facing) setTimeout(() => fitOpening(true), 200);

window.__whl = { bus, chrome, store, get viewer() { return viewer; },
  get txPane() { return txPane; }, get winPane() { return winPane; },
  runBalance, buildMini, get S() { return S; } };
</script>
