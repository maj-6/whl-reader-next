<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore &middot; Ghost — WHL Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<style>
  html, body { height: 100%; }
  body { overflow: hidden; }

  /* ---- full-bleed stage; topbar floats translucent over it ---- */
  .stage { position: absolute; inset: 0; background: var(--bg-sunk); }
  #osd { position: absolute; inset: 0; }
  #osd .openseadragon-canvas { outline: none; }

  .topbar {
    position: absolute; top: 12px; left: 12px; right: 12px; z-index: 60;
    border: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
    border-radius: var(--radius-lg);
    background: color-mix(in srgb, var(--bg-raise) 80%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
  }
  .col-ind { padding: 4px 6px; white-space: nowrap;
    font: 600 12px var(--font-chrome); color: var(--ink-2); }

  /* ---- ghost layer ---- */
  /* the ghosts are the interaction surface; the viewer's own overlays stay passive */
  #osd .wv-region, #osd .wv-word { pointer-events: none; }
  #osd { --ghost-alpha: .45; --ghost-scale: 760; }
  .gh {
    position: absolute; inset: 0; pointer-events: auto; cursor: pointer;
    opacity: var(--ghost-alpha);
    background: color-mix(in srgb, var(--bg-raise) 80%, transparent);
    color: var(--ink);
    font: 400 calc(var(--ghost-scale) * var(--fw, .014) * 1px)/1.28 var(--font-read);
    padding: .22em .5em; overflow: hidden; border-radius: .15em;
  }
  #osd.mode-tx .gh { font-style: italic; }
  .gh.pin { opacity: 1; background: var(--bg-raise); box-shadow: var(--shadow);
    z-index: 5; font-style: normal; }
  #osd.mode-tx .gh.pin { font-style: italic; }
  .gh.hid { display: none; }
  #osd.gh-off .gh { pointer-events: none; }

  /* ---- the one control: opacity slider + content toggle, docked bottom-center ---- */
  .dock { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 60;
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: color-mix(in srgb, var(--bg-raise) 82%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
    border-radius: 99px; box-shadow: var(--shadow); }
  .dock input[type=range] { width: 170px; margin: 0; accent-color: var(--accent); }
  .gseg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 99px;
    overflow: hidden; transition: opacity .3s; }
  .gseg button { border: 0; background: none; padding: 4px 12px; cursor: pointer;
    font: 11.5px var(--font-chrome); color: var(--ink-2); }
  .gseg button.active { background: var(--tint-select); color: var(--ink); font-weight: 600; }
  .dock.zero .gseg { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<script>const _s=localStorage.getItem('whlnext-scheme')||'archive',_m=localStorage.getItem('whlnext-mode')||'light';document.documentElement.dataset.scheme=_s;document.documentElement.dataset.mode=_m;</script>

<div class="stage">
  <div id="osd"></div>
  <div class="dock" id="dock">
    <input type="range" id="alpha" min="0" max="100" value="45" aria-label="Ghost layer opacity">
    <div class="gseg" id="seg" role="group" aria-label="Ghost content">
      <button type="button" data-m="translation" class="active">translation</button>
      <button type="button" data-m="transliteration">transliteration</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/openseadragon@5.0/build/openseadragon/openseadragon.min.js"></script>
<script type="module">
import { createBus } from './lib/whl-bus.js';
import { mountChrome } from './lib/whl-chrome.js';
import { createRoll, COLS, DATA_COLS, romanCol } from './explore-common.js';

const $ = s => document.querySelector(s);
const bus = createBus();
const host = $('#osd');

const chrome = mountChrome({
  title: 'Papyrus Ebers', back: 'explore-concepts.html', bus,
  book: { label: 'EB01', title: 'Papyrus Ebers', thumb: 'assets/thumbs/EB01.jpg' },
  adv: false, mockSwitch: 'mode-only',
  note: 'Ghost layer — slider sets its opacity, toggle swaps translation/transliteration; click a ghost to pin it, Esc unpins; &larr;/&rarr; pan columns.'
});

/* column indicator inserted into the topbar (chrome.el IS the .topbar) */
const ind = document.createElement('div');
ind.className = 'col-ind';
chrome.el.insertBefore(ind, chrome.el.querySelector('.mock-switch'));

// createRoll merges viewerOpts.profile over its scroll-h RTL defaults; the full
// profile is restated here only for explicitness.
const { viewer, store } = createRoll({
  el: host, bus,
  viewerOpts: { profile: { layout: 'scroll-h', direction: 'rtl', gap: 0,
    viewportEvents: true, zoomOnSelect: false } },
});

bus.on('highlight', h => viewer.applyHighlight(h));
bus.on('view', ({ page }) => { ind.textContent = 'Column ' + romanCol(page) + ' · ' + page; });

/* ---------- world geometry of each FULL image (plane space; clipped window = height 1) ---------- */
const geo = {};
for (const p of COLS) {
  const c = p.clip || {};
  const H = 1 / (1 - (c.top || 0) - (c.bottom || 0));
  geo[p.key] = { W: H * p.w / p.h, H };
}

/* ---------- ghost blocks ---------- */
let mode = 'translation';       // | 'transliteration'
let scale = 760;                // px per world unit (kept on --ghost-scale)
let pinned = null;
const ghosts = [];              // {page, r, el, xl, tx, fwXl, fwTx}
const built = new Set();
const OSD = window.OpenSeadragon;

// font size in world units so text fits its region box (chars ~.52em wide, lh 1.28)
function fitFw(n, bw, bh) {
  if (!n || bw <= 0 || bh <= 0) return .014;
  const fw = Math.sqrt((bw * bh * .72) / (n * .52 * 1.28));
  return Math.min(fw, bh / 2.1, .022);
}
function fwOf(rec) { return mode === 'translation' ? rec.fwXl : rec.fwTx; }
function textOf(rec) { return mode === 'translation' ? rec.xl : rec.tx; }

function groupsFor(page, r) {
  const ix = store.get(page)?.index;
  if (!ix) return null;
  const g = [...new Set([...(ix.bySource[r] || []), ...(ix.byTranslation[r] || [])])];
  return g.length ? g : null;
}

// OSD pointer capture retargets real clicks away from overlay elements (same
// workaround as whl-viewer's clickable): MouseTracker per ghost in OSD mode.
function clickable(el, fn) {
  if (OSD && OSD.MouseTracker) {
    new OSD.MouseTracker({ element: el, clickHandler: ev => { if (ev.quick === false) return; fn(); } });
  } else {
    el.addEventListener('click', e => { e.stopPropagation(); fn(); });
  }
}

function togglePin(rec) {
  if (pinned === rec) { unpin(); return; }
  if (pinned) pinned.el.classList.remove('pin');
  pinned = rec;
  rec.el.classList.add('pin');
  bus.emit('select', { page: rec.page, region: rec.r, groups: groupsFor(rec.page, rec.r) || undefined });
}
function unpin(silent) {
  if (pinned) { pinned.el.classList.remove('pin'); pinned = null; }
  if (!silent) bus.emit('select:clear', {});
}

function buildCol(page) {
  if (built.has(page)) return;
  const src = store.get(page)?.source;
  if (!src || !Array.isArray(src.regions)) return;
  built.add(page);
  const g = geo[page];
  // ghost bands must not overlap even where region boxes interleave on the roll:
  // clamp each band's top to the bottom of the previous band
  const regs = src.regions
    .map((rg, r) => ({ rg, r }))
    .filter(({ rg }) => rg && Array.isArray(rg.box) && rg.translation)
    .sort((a, b) => a.rg.box[1] - b.rg.box[1]);
  let floor = 0;
  for (const { rg, r } of regs) {
    const [x0, y0, x1, y1] = rg.box;
    const top = Math.max(y0, floor);
    if (y1 - top < .004) continue;
    floor = y1;
    const bw = (x1 - x0) * g.W, bh = (y1 - top) * g.H;
    const xl = rg.translation, tx = rg.text || '—';
    const el = document.createElement('div');
    el.className = 'gh';
    const rec = { page, r, el, xl, tx, fwXl: fitFw(xl.length, bw, bh), fwTx: fitFw(tx.length, bw, bh) };
    el.textContent = textOf(rec);
    el.style.setProperty('--fw', String(fwOf(rec)));
    viewer.addOverlayEl(page, [x0, top, x1, y1], el);
    el.addEventListener('pointerenter', () =>
      bus.emit('hover', { src: 'ghost', page, region: r, groups: groupsFor(page, r) || undefined }));
    el.addEventListener('pointerleave', () => bus.emit('hover:clear'));
    clickable(el, () => togglePin(rec));
    ghosts.push(rec);
  }
  applyScale();
}
bus.on('layer', ev => { if (ev.name === 'source' && ev.status === 'ready') buildCol(ev.page); });
for (const k of DATA_COLS) buildCol(k);   // no-op until each source layer lands; col-0047 never does

/* ---------- zoom-tracking text size: one CSS var on the plane container ---------- */
function applyScale() {
  host.style.setProperty('--ghost-scale', String(scale));
  for (const rec of ghosts) {
    const px = fwOf(rec) * scale;
    rec.el.classList.toggle('hid', px < 9 || px > 40);
  }
}
let vLast = null, vRaf = 0;
bus.on('viewport', v => {
  vLast = v;
  if (vRaf) return;
  vRaf = requestAnimationFrame(() => {
    vRaf = 0;
    if (!vLast || !vLast.h || !host.clientHeight) return;
    const s = host.clientHeight / vLast.h;
    if (Math.abs(s - scale) > .5) { scale = s; applyScale(); }
  });
});
(function seedScale(n) {   // before the first pan/zoom no 'viewport' event has fired
  const v = viewer.viewportInfo();
  if (v && v.h && host.clientHeight) { scale = host.clientHeight / v.h; applyScale(); }
  else if (n < 90) requestAnimationFrame(() => seedScale(n + 1));
})(0);

/* ---------- the one control ---------- */
const dock = $('#dock'), alphaEl = $('#alpha'), seg = $('#seg');
function setAlpha(v) {
  host.style.setProperty('--ghost-alpha', String(v / 100));
  host.classList.toggle('gh-off', v === 0);
  dock.classList.toggle('zero', v === 0);
  if (v === 0) unpin();
}
alphaEl.addEventListener('input', () => setAlpha(+alphaEl.value));
setAlpha(+alphaEl.value);

seg.addEventListener('click', e => {
  const b = e.target.closest('button[data-m]');
  if (!b || b.dataset.m === mode) return;
  mode = b.dataset.m;
  for (const x of seg.querySelectorAll('button')) x.classList.toggle('active', x === b);
  host.classList.toggle('mode-tx', mode === 'transliteration');
  for (const rec of ghosts) {
    rec.el.textContent = textOf(rec);
    rec.el.style.setProperty('--fw', String(fwOf(rec)));
  }
  applyScale();
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (/input|select|textarea/i.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') { viewer.next(); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { viewer.prev(); e.preventDefault(); }
  else if (e.key === 'Escape') { unpin(true); bus.emit('select:clear', {}); }
});
</script>
</body>
</html>
